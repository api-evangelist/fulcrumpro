openapi: 3.0.4
info:
  title: Fulcrum Public Accounting Code Customer Contact API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Customer Contact
paths:
  /api/customers/{customerId}/contacts:
    post:
      tags:
      - Customer Contact
      summary: Create a new customer contact
      operationId: CreateCustomerContact
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerContactCreateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerContactCreateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CustomerContactCreateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CustomerContactCreateDto'
        required: true
      responses:
        '200':
          description: Customer contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
        '400':
          description: Validation issues with input
        '404':
          description: Customer with the given id did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Customer-Customers-Edit Customer
  /api/customers/{customerId}/contacts/{contactId}:
    delete:
      tags:
      - Customer Contact
      summary: Delete a specific customer contact
      operationId: DeleteCustomerContact
      parameters:
      - name: customerId
        in: path
        description: The id of the customer to modify contacts for
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: contactId
        in: path
        description: The id of the customer contact.
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: Success
        '204':
          description: Customer contact did not exist
        '404':
          description: The customer did not exist
    get:
      tags:
      - Customer Contact
      summary: Get a specific customer contact
      operationId: GetCustomerContact
      parameters:
      - name: customerId
        in: path
        description: The id of the customer to modify contacts for
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: contactId
        in: path
        description: The id of the customer contact.
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: The customer contact for the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContactDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CustomerContactDto'
        '404':
          description: Customer or contact did not exist
      x-c4-required-permissions:
      - Customer-Customers-View Customer
    put:
      tags:
      - Customer Contact
      summary: Update a specific customer contact
      operationId: UpdateCustomerContact
      parameters:
      - name: customerId
        in: path
        description: The id of the customer to modify contacts for
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: contactId
        in: path
        description: The id of the customer contact.
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      requestBody:
        description: The new data to apply to the given index
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerContactUpdateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerContactUpdateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CustomerContactUpdateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CustomerContactUpdateDto'
        required: true
      responses:
        '200':
          description: The customer for the given id
        '404':
          description: Customer did not exist or no contact existed at the specified index
      x-c4-mutation: true
      x-c4-required-permissions:
      - Customer-Customers-Edit Customer
  /api/customers/{customerId}/contacts/list:
    post:
      tags:
      - Customer Contact
      summary: Get a list of contacts for a customer
      operationId: ListCustomerContact
      parameters:
      - name: customerId
        in: path
        description: ''
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: List of contacts for the given customer id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerContactDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerContactDto'
        '404':
          description: The customer did not exist
      x-c4-required-permissions:
      - Customer-Customers-View Customer
components:
  schemas:
    CustomerContactUpdateDto:
      required:
      - firstName
      type: object
      properties:
        firstName:
          maxLength: 200
          minLength: 1
          type: string
          description: First name
        lastName:
          maxLength: 200
          minLength: 1
          type: string
          description: Last name
          nullable: true
        position:
          maxLength: 200
          minLength: 1
          type: string
          description: Position / Job Title
          nullable: true
        phone:
          type: string
          description: Phone number
          nullable: true
        cellPhone:
          type: string
          description: Cellphone number
          nullable: true
        email:
          type: string
          description: Email address
          format: email
          nullable: true
      additionalProperties: false
      description: A customer contact
    CustomerContactDto:
      required:
      - firstName
      - id
      - lastName
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 36
          type: string
          description: Id
        firstName:
          maxLength: 200
          minLength: 1
          type: string
          description: First name
        lastName:
          maxLength: 200
          minLength: 1
          type: string
          description: Last name
        position:
          maxLength: 200
          minLength: 1
          type: string
          description: Position / Job Title
          nullable: true
        cellPhone:
          type: string
          description: Cellphone number
          nullable: true
        phone:
          type: string
          description: Phone number
          nullable: true
        email:
          type: string
          description: Email address
          format: email
          nullable: true
      additionalProperties: false
      description: A customer contact
    CreatedResponseDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The id of the created record
      additionalProperties: false
      description: Response for a created record
    CustomerContactCreateDto:
      required:
      - firstName
      type: object
      properties:
        firstName:
          maxLength: 200
          minLength: 1
          type: string
          description: First name
        lastName:
          maxLength: 200
          minLength: 1
          type: string
          description: Last name
          nullable: true
        position:
          maxLength: 200
          minLength: 1
          type: string
          description: Position / Job Title
          nullable: true
        phone:
          type: string
          description: Phone number
          nullable: true
        cellPhone:
          type: string
          description: Cellphone number
          nullable: true
        email:
          type: string
          description: Email address
          format: email
          nullable: true
      additionalProperties: false
      description: A customer contact
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
