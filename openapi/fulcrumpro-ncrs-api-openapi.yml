openapi: 3.0.4
info:
  title: Fulcrum Public Accounting Code NCRs API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: NCRs
paths:
  /api/ncrs/{ncrId}:
    get:
      tags:
      - NCRs
      summary: Get a specific NCR by id.
      operationId: GetNcr
      parameters:
      - name: ncrId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: The NCR for the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NCRNcrDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NCRNcrDto'
        '404':
          description: An NCR with that id does not exist.
      x-c4-required-permissions:
      - Quality-NCR-View NCR
  /api/ncrs/list:
    post:
      tags:
      - NCRs
      summary: Finds NCRs based on search parameters
      operationId: ListNCR
      parameters:
      - name: Sort.Field
        in: query
        description: Sort field
        schema:
          minLength: 1
          type: string
      - name: Sort.Dir
        in: query
        description: Sort direction
        schema:
          $ref: '#/components/schemas/CommonEnumSortDirectionEnum'
      - name: Skip
        in: query
        description: Number of records to skip.
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: Take
        in: query
        description: Number of records to return (maximum)
        schema:
          maximum: 5000
          minimum: 0
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/NCRRequestNcrListParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/NCRRequestNcrListParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/NCRRequestNcrListParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/NCRRequestNcrListParameters'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoNCRNcrDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoNCRNcrDto'
      x-c4-required-permissions:
      - Quality-NCR-View NCR
components:
  schemas:
    NCRNcrDto:
      required:
      - cause
      - detail
      - id
      - number
      - type
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique id associated to this entity.
        number:
          minimum: 0
          type: integer
          description: Number
          format: int32
        type:
          minLength: 1
          type: string
          description: NCR Type
        cause:
          minLength: 1
          type: string
          description: Cause
        detail:
          maxLength: 2000
          minLength: 1
          type: string
          description: Detail - required notes on the NCR
        departmentId:
          maxLength: 24
          minLength: 24
          type: string
          description: Department key identifier. Please reference /api/departments endpoint.
          nullable: true
        department:
          $ref: '#/components/schemas/CommonReferenceDto'
        vendorId:
          maxLength: 24
          minLength: 24
          type: string
          description: Vendor key identifier. Please reference /api/vendors endpoint.
          nullable: true
        vendor:
          $ref: '#/components/schemas/CommonReferenceDto'
        workCenters:
          type: string
          description: The work centers assigned to this NCR.
          nullable: true
          readOnly: true
        scheduledEquipment:
          type: string
          description: Affected Equipment
          nullable: true
          readOnly: true
        reason:
          type: string
          description: Reason
          nullable: true
        operator:
          $ref: '#/components/schemas/CommonReferenceDto'
        status:
          type: string
          description: NCR Status
          nullable: true
        quantityImpacted:
          type: number
          description: Quantity Impacted
          format: double
          nullable: true
          readOnly: true
        incrementalCost:
          type: number
          description: Incremental Cost
          format: double
          nullable: true
          readOnly: true
        createdUtc:
          type: string
          description: Created Date
          format: date-time
          nullable: true
        completedUtc:
          type: string
          description: Completed Date
          format: date-time
          nullable: true
        jobIds:
          type: array
          items:
            type: string
          description: Impacted Job IDs
          readOnly: true
        customFields:
          type: object
          additionalProperties: {}
          description: Custom fields that have been defined on this entity.
          nullable: true
        completedBy:
          $ref: '#/components/schemas/CommonReferenceDto'
        analyzedBy:
          $ref: '#/components/schemas/CommonReferenceDto'
        impacts:
          type: array
          items:
            $ref: '#/components/schemas/CommonImpactDto'
          description: Impact information.
          nullable: true
      additionalProperties: false
      description: Represents an NCR
    CommonImpactDto:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The ID for this object.
          format: uuid
        operation:
          $ref: '#/components/schemas/CommonReferenceDto'
        workCenter:
          $ref: '#/components/schemas/CommonReferenceDto'
        scheduledEquipment:
          $ref: '#/components/schemas/CommonReferenceDto'
        job:
          $ref: '#/components/schemas/CommonReferenceDto'
        salesOrder:
          $ref: '#/components/schemas/CommonReferenceDto'
        quantityImpacted:
          type: number
          description: Quantity Impacted
          format: double
          nullable: true
        incrementalCost:
          type: number
          description: Incremental Cost
          format: double
          nullable: true
      additionalProperties: false
      description: Impact Dto.
    NCRRequestNcrListParameters:
      type: object
      properties:
        status:
          type: string
          description: 'Filter NCRs by a specific status

            Accepted Values:

            Closed, Hold, New, Quality Review, Engineering Review'
          nullable: true
        type:
          type: string
          description: Filter NCRs by a specific type. Available values are configured per tenant in Quality settings (NCR dropdowns).
          nullable: true
        cause:
          type: string
          description: Filter NCRs by a specific cause. Available values are configured per tenant in Quality settings (NCR dropdowns).
          nullable: true
        reason:
          type: string
          description: Filter NCRs by a specific reason. Available values are configured per tenant in Quality settings (NCR dropdowns).
          nullable: true
        createdUtc:
          type: string
          description: Filter NCRs created after a certain date
          format: date-time
          nullable: true
      additionalProperties: false
      description: Parameters used for searching NCRs
    DtoPagedResultDtoNCRNcrDto:
      required:
      - data
      - hasNextPage
      - hasPreviousPage
      - page
      - pageSize
      - totalCount
      - totalPages
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NCRNcrDto'
          description: The data
        page:
          type: integer
          description: The 1-indexed page
          format: int32
          readOnly: true
        pageSize:
          type: integer
          description: The page size
          format: int32
          readOnly: true
        totalCount:
          type: integer
          description: The total count of records
          format: int32
        totalPages:
          type: integer
          description: The total pages
          format: int32
          readOnly: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          readOnly: true
        hasNextPage:
          type: boolean
          description: True if there is a next page
          readOnly: true
      additionalProperties: false
      description: Paged result
    CommonEnumSortDirectionEnum:
      enum:
      - ascending
      - descending
      type: string
      description: Specify sorting direction.
    CommonReferenceDto:
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique Id associated to the referenced object
          nullable: true
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: Descriptive name associated to the object
          nullable: true
      additionalProperties: false
      description: Represents a reference to a document in a DB collection
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
