openapi: 3.2.0
info:
  title: Fulcrum Public Inventory Transactions API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Inventory Transactions
paths:
  /api/inventory-transactions/list:
    post:
      tags:
      - Inventory Transactions
      summary: Finds inventory transactions based on search parameters
      operationId: ListInventoryTransactions
      parameters:
      - name: Sort.Field
        in: query
        description: Sort field
        schema:
          minLength: 1
          type: string
      - name: Sort.Dir
        in: query
        description: Sort direction
        schema:
          $ref: '#/components/schemas/CommonEnumSortDirectionEnum'
      - name: Skip
        in: query
        description: 'Number of records to skip. Defaults to 0. Combine with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Take to page

          through a result set larger than one page.'
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: Take
        in: query
        description: 'Number of records to return. Validation accepts 0 through 5000, but `0` is not a

          page size and what an endpoint does with it varies, so send a value from 1 to 5000.


          Two cases differ. A request that supplies paging but leaves this field out takes this

          field''s default of <b>50</b>. A request that supplies no paging at all is

          endpoint-specific — some define their own fallback — so it does not reliably mean any

          particular number of records. Either way the response says nothing about records it

          did not return, so send this explicitly whenever the size of the answer matters.

          Endpoints returning a paged envelope report `totalCount` and `hasNextPage`

          alongside the records; endpoints returning a bare array report neither, so page those

          with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Skip until a page comes back shorter than the value requested.'
        schema:
          maximum: 5000
          minimum: 0
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/InventoryTransactionsListParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransactionsListParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/InventoryTransactionsListParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/InventoryTransactionsListParameters'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoInventoryTransactionDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoInventoryTransactionDto'
      x-c4-exposed: true
      x-c4-required-permissions:
      - ItemsAndInventory-Items-View Inventory
components:
  schemas:
    InventoryEventSecondaryType:
      enum:
      - pick
      - receive
      - override
      - revert
      - deposit
      - create
      - consume
      - ship
      - sold
      - transferOut
      - transferIn
      - found
      - expired
      - damaged
      - lost
      - returnVendor
      - returnStock
      - receivedNoPo
      - returnIncrease
      - returnDecrease
      - otherIncrease
      - otherDecrease
      - scrap
      - waste
      - transferredFromSalesOrder
      - overrideItemValue
      - transferFromLot
      - transferToLot
      - stockAdjustmentIncrease
      - stockAdjustmentDecrease
      - stockTake
      type: string
      description: Secondary, verbose description for an event.
    CommonReferenceDto:
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: Unique Id associated to the referenced object
        name:
          maxLength: 200
          minLength: 1
          type:
          - string
          - 'null'
          description: Descriptive name associated to the object
      additionalProperties: false
      description: Represents a reference to a document in a DB collection
    InventoryTransactionsListParameters:
      type: object
      properties:
        itemIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Filter inventory transactions based on item identifiers.
        dateRange:
          $ref: '#/components/schemas/DtoCommonDateRangeFilter'
        sourceType:
          $ref: '#/components/schemas/V2InventoryDataEventSourceType'
        relatedEntityType:
          $ref: '#/components/schemas/V2InventoryDataEventSourceType'
        relatedEntityId:
          type:
          - string
          - 'null'
          description: The transaction's related entity identifier
      additionalProperties: false
      description: Parameters used for searching inventory transactions
    InventoryTransactionSourceDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InventoryEnumEventSourceType'
        name:
          type:
          - string
          - 'null'
          description: Display name of the source, such as the job or order number
        jobId:
          type:
          - string
          - 'null'
          description: Id of the job the transaction belongs to, including a job's picks recorded against a work order operation. Null when the transaction is not tied to a single job, such as material picked for a work order nest.
        itemToMakeId:
          type:
          - string
          - 'null'
          description: Id of the job's item to make, set when a job put a made item into inventory
      additionalProperties: false
      description: The action that created an inventory transaction
    CommonEnumSortDirectionEnum:
      enum:
      - ascending
      - descending
      type: string
      description: Specify sorting direction.
    InventoryEventType:
      enum:
      - pick
      - receive
      - revert
      - adjustment
      - setItemValue
      - eventOverride
      type: string
      description: Primary inventory event type.
    DtoPagedResultDtoInventoryTransactionDto:
      required:
      - data
      - hasNextPage
      - hasPreviousPage
      - page
      - pageSize
      - totalCount
      - totalPages
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryTransactionDto'
          description: The data
        page:
          type: integer
          description: The 1-indexed page
          format: int32
          readOnly: true
        pageSize:
          type: integer
          description: The page size
          format: int32
          readOnly: true
        totalCount:
          type: integer
          description: The total count of records
          format: int32
        totalPages:
          type: integer
          description: The total pages
          format: int32
          readOnly: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          readOnly: true
        hasNextPage:
          type: boolean
          description: True if there is a next page
          readOnly: true
      additionalProperties: false
      description: Paged result
    InventoryEnumEventSourceType:
      enum:
      - purchaseOrder
      - job
      - shipment
      - shipmentLineItem
      - shipping
      - receiving
      - item
      - workOrder
      - salesOrder
      - jobOperation
      - workOrderOperation
      - fulfillment
      - itemToMakeMaterialRemnant
      - poRcvValueAdj
      type: string
      description: Indicator for the initial source of the event.
    DtoCommonDateRangeFilter:
      type: object
      properties:
        start:
          type:
          - string
          - 'null'
          description: Inclusive start date to filter by
          format: date-time
        end:
          type:
          - string
          - 'null'
          description: Inclusive end date to filter by
          format: date-time
      additionalProperties: false
      description: Date range used for filters
    InventoryTransactionDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The id of the transaction
        date:
          type: string
          description: The date of the transaction
          format: date-time
        type:
          $ref: '#/components/schemas/InventoryEventType'
        secondaryType:
          $ref: '#/components/schemas/InventoryEventSecondaryType'
        item:
          $ref: '#/components/schemas/CommonReferenceDto'
        location:
          $ref: '#/components/schemas/CommonReferenceDto'
        lot:
          $ref: '#/components/schemas/CommonReferenceDto'
        quantity:
          type: number
          description: The quantity of the transaction
          format: double
        valueChange:
          type: number
          description: The item value change caused by the transaction
          format: double
        qtyChange:
          type: number
          description: The item quantity change caused by the transaction
          format: double
        note:
          type:
          - string
          - 'null'
          description: The note on the transaction
        value:
          type:
          - number
          - 'null'
          description: The per-unit value of the transaction
          format: double
        totalValue:
          type:
          - number
          - 'null'
          description: The total value of the transaction
          format: double
          readOnly: true
        source:
          $ref: '#/components/schemas/InventoryTransactionSourceDto'
      additionalProperties: false
      description: An inventory transaction
    V2InventoryDataEventSourceType:
      enum:
      - purchaseOrder
      - job
      - shipment
      - shipmentLineItem
      - shipping
      - receiving
      - item
      - workOrder
      - salesOrder
      - jobOperation
      - workOrderOperation
      - fulfillment
      - itemToMakeMaterialRemnant
      - poRcvValueAdj
      type: string
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
