openapi: 3.0.4
info:
  title: Fulcrum Public Accounting Code Invoice Part Line Item API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Invoice Part Line Item
paths:
  /api/invoices/{invoiceId}/part-line-items/{lineItemId}:
    get:
      tags:
      - Invoice Part Line Item
      summary: Get a specific part line item for an invoice
      operationId: GetInvoicePartLineItem
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: lineItemId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: Part line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePartLineItemDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvoicePartLineItemDto'
        '404':
          description: Invoice or line items did not exist
      x-c4-required-permissions:
      - Invoicing-Invoicing-View Invoices
    patch:
      tags:
      - Invoice Part Line Item
      summary: Partially update a specific part line item for an invoice
      operationId: PatchInvoicePartLineItem
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: lineItemId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatchDocument'
      responses:
        '200':
          description: Part line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePartLineItemDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvoicePartLineItemDto'
        '404':
          description: Invoice or line item did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Invoicing-Invoicing-Edit Invoices
    put:
      tags:
      - Invoice Part Line Item
      summary: Update a specific part line item for an invoice
      operationId: UpdateInvoicePartLineItem
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: lineItemId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/InvoicePartLineItemUpdateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePartLineItemUpdateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/InvoicePartLineItemUpdateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/InvoicePartLineItemUpdateDto'
        required: true
      responses:
        '200':
          description: Part line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePartLineItemDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvoicePartLineItemDto'
        '404':
          description: Invoice or line item did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Invoicing-Invoicing-Edit Invoices
  /api/invoices/{invoiceId}/part-line-items/list:
    post:
      tags:
      - Invoice Part Line Item
      summary: Get a list of part lines items for an invoice
      operationId: ListInvoicePartLineItem
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: List of part line items for the given invoice id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoicePartLineItemDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoicePartLineItemDto'
        '404':
          description: The invoice did not exist
      x-c4-required-permissions:
      - Invoicing-Invoicing-View Invoices
components:
  schemas:
    CommonExternalReferenceDto:
      required:
      - externalId
      type: object
      properties:
        type:
          maxLength: 50
          minLength: 0
          type: string
          description: Specifies the type of this identifier.
          nullable: true
        externalId:
          maxLength: 500
          minLength: 0
          type: string
          description: The external identifier
        displayId:
          maxLength: 500
          minLength: 0
          type: string
          description: 'The id/number that a human sees. For a quote, this might be ''Q1000''.  If this is null, the display

            will fall back to the ExternalId'
          nullable: true
        status:
          type: string
          description: A status for the external reference
          nullable: true
        url:
          type: string
          description: An external url for the reference
          nullable: true
        modifiedUtc:
          type: string
          description: Date the external reference was modified
          format: date-time
          nullable: true
        lastSyncedUtc:
          type: string
          description: 'Date the external system last successfully synced this reference. Set by integrations

            on successful sync only; null means never synced or that the sync timestamp isn''t

            maintained by the integration.'
          format: date-time
          nullable: true
      additionalProperties: false
      description: The external reference for entities that implement FulcrumProduct.Domain.Common.IHasExternalReferences
    JsonPatchOperation:
      type: object
      properties:
        op:
          type: string
        value:
          type: string
        path:
          type: string
    InvoicePartLineItemUpdateDto:
      type: object
      properties:
        externalReferences:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CommonExternalReferenceDto'
          description: Arbitrary key-value-pair like data that can be used to later on search for this line item.
          nullable: true
      additionalProperties: false
      description: Represents a part line item on an invoice.
    JsonPatchDocument:
      type: array
      items:
        $ref: '#/components/schemas/JsonPatchOperation'
      description: Array of operations to perform
    InvoicePartLineItemDto:
      required:
      - accountingDetails
      - discountedPrice
      - id
      - isTaxable
      - itemId
      - name
      - preDiscountSubTotal
      - price
      - quantity
      - subTotal
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 36
          type: string
          description: Unique id associated to this entity.
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: The line item name.
        quantity:
          minimum: 0
          type: number
          description: The line item quantity.
          format: double
        price:
          minimum: 0
          type: number
          description: The line item price.
          format: double
        discountedPrice:
          minimum: 0
          type: number
          description: The discounted line item price.
          format: double
        overrideTaxRate:
          type: boolean
          description: Dictate if the tax rate is overridden.
          nullable: true
        isTaxable:
          type: boolean
          description: Dictate if this line item is taxable.
        taxCodeId:
          maxLength: 24
          minLength: 24
          type: string
          description: Tax code key identifier. Please reference /api/tax-rates endpoint.
          nullable: true
        taxRate:
          minimum: 0
          type: number
          description: Tax rate to use for this entity. If a FulcrumProduct.PublicApi.Dto.Invoice.PartLineItem.PartLineItemDto.TaxCodeId is provided, the provided FulcrumProduct.PublicApi.Dto.Invoice.PartLineItem.PartLineItemDto.TaxRate will supercede the defined tax rate.
          format: double
          nullable: true
        itemId:
          maxLength: 24
          minLength: 24
          type: string
          description: Item id associated with this line item.
        description:
          maxLength: 2000
          minLength: 0
          type: string
          description: The part line item description.  Defaults to the item's description if none specified.
          nullable: true
        externalReferences:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CommonExternalReferenceDto'
          description: Arbitrary key-value-pair like data that can be used to later on search for this line item.
          nullable: true
        accountingCodeId:
          maxLength: 24
          minLength: 24
          type: string
          description: Accounting code key identifier. Please reference /api/accounting-codes endpoint.
          nullable: true
        salesOrderLineItemId:
          maxLength: 36
          minLength: 36
          type: string
          description: Related sales order line item id.
          nullable: true
        subTotal:
          minimum: 0
          type: number
          description: Total line item cost, including applicable discounts
          format: double
        preDiscountSubTotal:
          minimum: 0
          type: number
          description: Total line item cost, before discounts
          format: double
        isPercentageDiscount:
          type: boolean
          description: Indicates whether FulcrumProduct.PublicApi.Dto.Invoice.PartLineItem.PartLineItemDto.DiscountAmount discount is percentage based (else, it's an absolute amount).
          nullable: true
        discountAmount:
          type: number
          description: The amount of the discount.
          format: double
          nullable: true
        customerPartNumber:
          maxLength: 200
          minLength: 1
          type: string
          description: The customer's known part line item number.
          nullable: true
        customerPartDescription:
          maxLength: 2000
          minLength: 0
          type: string
          description: The customer's known part line item description.
          nullable: true
        shipmentIds:
          type: array
          items:
            type: string
          description: The shipment identifiers that were invoiced.
        number:
          type: integer
          description: Line number
          format: int32
        accountingDetails:
          $ref: '#/components/schemas/CommonAccountingDetailsDto'
      additionalProperties: false
      description: Represents a part line item on a sales order.
    CommonAccountingDetailsDto:
      type: object
      properties:
        classId:
          maxLength: 24
          minLength: 24
          type: string
          description: Item class identifier. Please reference /api/item-classes endpoint.
          nullable: true
        incomeAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: Income account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
        assetAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: Asset account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
        expenseAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: Expense account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
        cogsAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: COGS account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
      additionalProperties: false
      description: An object that contains all accounting details.
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
