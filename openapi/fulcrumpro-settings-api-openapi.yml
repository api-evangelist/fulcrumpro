openapi: 3.2.0
info:
  title: Fulcrum Public Settings API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Settings
paths:
  /api/settings/costing:
    get:
      tags:
      - Settings
      summary: Get the account's costing configuration
      operationId: GetCostingSettings
      responses:
        '200':
          description: The account's costing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsCostingSettingsDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SettingsCostingSettingsDto'
      x-c4-exposed: true
  /api/settings/pricing:
    get:
      tags:
      - Settings
      summary: 'Get the account''s sales pricing configuration: whether margin-based and Shop…'
      operationId: GetPricingSettings
      responses:
        '200':
          description: The account's sales pricing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPricingSettingsDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SettingsPricingSettingsDto'
      x-c4-exposed: true
      x-c4-required-permissions:
      - Pricing-Margins-View Margins
components:
  schemas:
    SettingsCostingSettingsDto:
      required:
      - overheadCalculationMethod
      type: object
      properties:
        overheadCalculationMethod:
          $ref: '#/components/schemas/SettingEnumOverheadCalculationMethodEnum'
      additionalProperties: false
      description: The account's costing configuration.
    SettingEnumOverheadCalculationMethodEnum:
      enum:
      - laborBurdened
      - machineBurdened
      type: string
      description: Which tracked time carries the overhead rate when costs are calculated.
    SettingsPricingSettingsDto:
      required:
      - defaultMargin
      - defaultMaterialMarkup
      - useDefaultMargin
      - useMarginBasedPricing
      - useShopRatePricing
      type: object
      properties:
        useMarginBasedPricing:
          type: boolean
          description: Whether margin-based pricing is turned on for the account.
        useDefaultMargin:
          type: boolean
          description: Whether the account offers `defaultMargin` on items as an option for margin-based pricing.
        defaultMargin:
          type: number
          description: The account's default margin, as a percentage (15 means 15%), returned as stored; 0 when it was never set.
          format: double
        useShopRatePricing:
          type: boolean
          description: Whether newly created items are priced with Shop Rate. False when the account never set it.
        defaultMaterialMarkup:
          type:
          - number
          - 'null'
          description: 'The material markup, as a percentage, pre-filled on new quote and sales order lines priced with Shop Rate

            when the item''s price break has no markup of its own. Null when the account has not set one.'
          format: double
      additionalProperties: false
      description: 'The account''s sales pricing configuration: how new items are priced by default. Margins and markups are

        percentages, in the same unit as a sales price break''s `margin` (15 means 15%).'
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
