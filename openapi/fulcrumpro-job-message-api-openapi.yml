openapi: 3.2.0
info:
  title: Fulcrum Public Job Message API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Job Message
paths:
  /api/jobs/{jobId}/messages:
    post:
      tags:
      - Job Message
      summary: Post a chat message on a job.
      operationId: CreateJobMessage
      parameters:
      - name: jobId
        in: path
        description: The job
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        description: The message to post
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobMessageCreateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageCreateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/JobMessageCreateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobMessageCreateDto'
        required: true
      responses:
        '200':
          description: Message posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
        '400':
          description: Validation issues with input, itemToMakeId and operationId were not supplied together, or a mention is not a user
        '404':
          description: Job did not exist, or the operation is not on that item-to-make of the job
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
  /api/jobs/{jobId}/messages/list:
    post:
      tags:
      - Job Message
      summary: List the chat messages on a job, newest first.
      operationId: ListJobMessages
      parameters:
      - name: jobId
        in: path
        description: The job
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: Sort.Field
        in: query
        description: Sort field
        schema:
          minLength: 1
          type: string
      - name: Sort.Dir
        in: query
        description: Sort direction
        schema:
          $ref: '#/components/schemas/CommonEnumSortDirectionEnum'
      - name: Skip
        in: query
        description: 'Number of records to skip. Defaults to 0. Combine with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Take to page

          through a result set larger than one page.'
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: Take
        in: query
        description: 'Number of records to return. Validation accepts 0 through 5000, but `0` is not a

          page size and what an endpoint does with it varies, so send a value from 1 to 5000.


          Two cases differ. A request that supplies paging but leaves this field out takes this

          field''s default of <b>50</b>. A request that supplies no paging at all is

          endpoint-specific — some define their own fallback — so it does not reliably mean any

          particular number of records. Either way the response says nothing about records it

          did not return, so send this explicitly whenever the size of the answer matters.

          Endpoints returning a paged envelope report `totalCount` and `hasNextPage`

          alongside the records; endpoints returning a bare array report neither, so page those

          with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Skip until a page comes back shorter than the value requested.'
        schema:
          maximum: 5000
          minimum: 0
          type: integer
          format: int32
      requestBody:
        description: Which chat on the job to list
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MessageRequestListJobMessagesParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequestListJobMessagesParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/MessageRequestListJobMessagesParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MessageRequestListJobMessagesParameters'
      responses:
        '200':
          description: The page of messages; an empty page when the chat has no messages yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoJobMessageDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoJobMessageDto'
        '400':
          description: itemToMakeId and operationId were not supplied together, or a sort was requested
        '404':
          description: Job did not exist, or the operation is not on that item-to-make of the job
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
components:
  schemas:
    CommonReferenceDto:
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: Unique Id associated to the referenced object
        name:
          maxLength: 200
          minLength: 1
          type:
          - string
          - 'null'
          description: Descriptive name associated to the object
      additionalProperties: false
      description: Represents a reference to a document in a DB collection
    JobMessageCreateDto:
      required:
      - body
      type: object
      properties:
        body:
          maxLength: 2000
          minLength: 1
          type: string
          description: Message text
        itemToMakeId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Id of the item-to-make to post on. Must be supplied together with operationId; omit both to post on the job itself.
        operationId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Id of the operation to post on. Must be supplied together with itemToMakeId; omit both to post on the job itself.
        mentions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: User Ids to @mention in the message. Please reference /api/users endpoints.
      additionalProperties: false
      description: A chat message to post on a job, or on one operation of an item-to-make on the job.
    CommonEnumSortDirectionEnum:
      enum:
      - ascending
      - descending
      type: string
      description: Specify sorting direction.
    DtoPagedResultDtoJobMessageDto:
      required:
      - data
      - hasNextPage
      - hasPreviousPage
      - page
      - pageSize
      - totalCount
      - totalPages
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobMessageDto'
          description: The data
        page:
          type: integer
          description: The 1-indexed page
          format: int32
          readOnly: true
        pageSize:
          type: integer
          description: The page size
          format: int32
          readOnly: true
        totalCount:
          type: integer
          description: The total count of records
          format: int32
        totalPages:
          type: integer
          description: The total pages
          format: int32
          readOnly: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          readOnly: true
        hasNextPage:
          type: boolean
          description: True if there is a next page
          readOnly: true
      additionalProperties: false
      description: Paged result
    JobMessageDto:
      required:
      - createdUtc
      - id
      - jobId
      - mentions
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: Unique id of the message
        jobId:
          maxLength: 24
          minLength: 24
          type: string
          description: Id of the job the message was posted on
        itemToMakeId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Id of the item-to-make the message was posted on; null for a job-level message
        operationId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Id of the operation the message was posted on; null for a job-level message
        body:
          type:
          - string
          - 'null'
          description: Message text
        mentions:
          type: array
          items:
            type: string
          description: Ids of the users @mentioned in the message. Please reference /api/users endpoints.
        createdUtc:
          type: string
          description: When the message was posted
          format: date-time
        createdBy:
          $ref: '#/components/schemas/CommonReferenceDto'
        modifiedUtc:
          type:
          - string
          - 'null'
          description: When the message was last edited
          format: date-time
      additionalProperties: false
      description: A chat message posted on a job, or on one operation of an item-to-make on the job.
    CreatedResponseDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The id of the created record
      additionalProperties: false
      description: Response for a created record
    MessageRequestListJobMessagesParameters:
      type: object
      properties:
        itemToMakeId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Id of the item-to-make whose operation chat to list. Must be supplied together with operationId.
        operationId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Id of the operation whose chat to list. Must be supplied together with itemToMakeId.
      additionalProperties: false
      description: Selects which chat on the job to list. Omit both ids for the job-level chat; supply both for one operation's chat.
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
