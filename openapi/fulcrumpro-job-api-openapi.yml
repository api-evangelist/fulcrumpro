openapi: 3.2.0
info:
  title: Fulcrum Public Job API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Job
paths:
  /api/jobs/{jobId}/cancel:
    post:
      tags:
      - Job
      summary: Cancel a specific job
      operationId: CancelJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: Success
        '204':
          description: Job did not exist
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
  /api/jobs:
    post:
      tags:
      - Job
      summary: Create a new job
      operationId: CreateJob
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
        required: true
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
        '400':
          description: Validation issues with input
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
  /api/jobs/{jobId}:
    get:
      tags:
      - Job
      summary: Get a specific job
      operationId: GetJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: The job for the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          description: Job did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
    patch:
      tags:
      - Job
      summary: Partially update a job
      operationId: PatchJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatchDocument'
      responses:
        '200':
          description: Job item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '400':
          description: The patch document is malformed — an unknown path, an unsupported operation, or a value the target field cannot hold
        '404':
          description: Job did not exist
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
    put:
      tags:
      - Job
      summary: Update a job
      operationId: UpdateJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
        required: true
      responses:
        '200':
          description: Job item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          description: Job did not exist
  /api/jobs/{jobId}/tracking:
    get:
      tags:
      - Job
      summary: Get a specific job's tracking information
      operationId: GetJobTracking
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: The job for the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTrackingDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobTrackingDto'
        '404':
          description: Job did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/{jobId}/in-process-tracking/list:
    post:
      tags:
      - Job
      summary: Lists a job's in process tracking checkpoints together with every recorded…
      description: 'The result is intentionally single-job-bounded to the job identified by jobId and is

        not paginated: it returns every checkpoint on the job (across its items to make and operations) with all

        recorded readings, and the readings axis is not independently bounded. Consumers should expect the

        response to scale with the job''s routing size and production volume. Checkpoints are ordered by operation

        order then checkpoint order; each checkpoint''s readings are ordered by sampling interval, then reading

        ordinal within the interval, then recorded time.'
      operationId: JobInProcessTrackingResponseList
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/InProcessTrackingResponseFindParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/InProcessTrackingResponseFindParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/InProcessTrackingResponseFindParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/InProcessTrackingResponseFindParameters'
      responses:
        '200':
          description: The job's in process tracking checkpoints and readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobInProcessTrackingCheckpointDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobInProcessTrackingCheckpointDto'
        '404':
          description: Job did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/list:
    post:
      tags:
      - Job
      summary: Find jobs based on search parameters
      operationId: ListJob
      parameters:
      - name: Sort.Field
        in: query
        description: Sort field
        schema:
          minLength: 1
          type: string
      - name: Sort.Dir
        in: query
        description: Sort direction
        schema:
          $ref: '#/components/schemas/CommonEnumSortDirectionEnum'
      - name: Skip
        in: query
        description: 'Number of records to skip. Defaults to 0. Combine with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Take to page

          through a result set larger than one page.'
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: Take
        in: query
        description: 'Number of records to return. Validation accepts 0 through 5000, but `0` is not a

          page size and what an endpoint does with it varies, so send a value from 1 to 5000.


          Two cases differ. A request that supplies paging but leaves this field out takes this

          field''s default of <b>50</b>. A request that supplies no paging at all is

          endpoint-specific — some define their own fallback — so it does not reliably mean any

          particular number of records. Either way the response says nothing about records it

          did not return, so send this explicitly whenever the size of the answer matters.

          Endpoints returning a paged envelope report `totalCount` and `hasNextPage`

          alongside the records; endpoints returning a bare array report neither, so page those

          with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Skip until a page comes back shorter than the value requested.'
        schema:
          maximum: 5000
          minimum: 0
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
      responses:
        '200':
          description: List of jobs matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDto'
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/{jobId}/status:
    post:
      tags:
      - Job
      summary: Update a job status
      operationId: StatusUpdateJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
          text/json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Job cannot be moved to requested status
        '404':
          description: Job did not exist
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
components:
  schemas:
    JobItemToMakeStatusEnum:
      enum:
      - new
      - working
      - complete
      - cancelled
      type: string
      description: Job Item to Make status
    CommonReferenceDto:
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: Unique Id associated to the referenced object
        name:
          maxLength: 200
          minLength: 1
          type:
          - string
          - 'null'
          description: Descriptive name associated to the object
      additionalProperties: false
      description: Represents a reference to a document in a DB collection
    CommonEnumSortDirectionEnum:
      enum:
      - ascending
      - descending
      type: string
      description: Specify sorting direction.
    GdtEnumModifierType:
      enum:
      - none
      - mmc
      - lmc
      - rfs
      - unequallyDisposedProfile
      - independency
      - continuousFeature
      - projectedToleranceZone
      - freeState
      - tangentPlane
      type: string
      description: 'Public mirror of FulcrumProduct.Domain.Gdt.Data.ModifierType. Members mirror the domain enum

        one-to-one by underlying value (guarded by JobInProcessTrackingEnumParityTests) so it maps by a plain cast,

        decoupling the published contract from renames of the internal enum.'
    JobTrackingItemToMakeDto:
      required:
      - depth
      - id
      - isCustom
      - itemId
      - quantityToMake
      - status
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 36
          type: string
          description: Unique Id associated to this entity
        itemId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Id of the item on which this entity is based.

            Please reference /api/items endpoint.'
        quantityToMake:
          type: number
          description: Quantity of this item produced by the associated job.
          format: double
        isCustom:
          type: boolean
          description: Denotes whether this job produces a customized version of the base item
        status:
          $ref: '#/components/schemas/JobItemToMakeStatusEnum'
        quantityMade:
          type:
          - number
          - 'null'
          description: Quantity already produced, if the job is in progress.
          format: double
        depth:
          type: integer
          description: 'Structurally, identify where in the tree of building the parent item this item lies.

            Example: The top-level item would have a depth of zero and it''s direct subcomponents would be 1.

            This cascades down so that a subcomponent to a subcomponent would be 2... and so on.'
          format: int32
        routingNotes:
          type:
          - string
          - 'null'
          description: 'The routing notes (the "Routing Notes" field) captured on this job''s routing for the item.

            Null when the job''s routing has no note for the item.'
        costBreakdown:
          $ref: '#/components/schemas/CommonCostBreakdownDto'
        costBreakdownEstimated:
          $ref: '#/components/schemas/CommonCostBreakdownDto'
        itemReference:
          $ref: '#/components/schemas/ItemReferenceDto'
      additionalProperties: false
      description: Represents an item to make on a job (for tracking purposes)
    CommonCostDto:
      required:
      - perUnit
      - total
      type: object
      properties:
        total:
          minimum: 0
          type: number
          description: Total
          format: double
        perUnit:
          minimum: 0
          type: number
          description: Cost per unit
          format: double
      additionalProperties: false
      description: Cost information
    JobUpdateDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the job
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        quantityToMake:
          type:
          - number
          - 'null'
          description: The quantity the job should make
          format: double
        productionDueDate:
          type:
          - string
          - 'null'
          description: The production due date
          format: date-time
        earliestStartDate:
          type:
          - string
          - 'null'
          description: If set, this is the earliest date that the job should be scheduled to begin.
          format: date-time
        notes:
          type:
          - string
          - 'null'
          description: The internal notes
      additionalProperties: false
      description: Represents an update on an Job.
    InProcessTrackingResponseFindParameters:
      type: object
      properties:
        phase:
          $ref: '#/components/schemas/InProcessTrackingFieldCheckpointPhase'
      additionalProperties: false
      description: Optional filters for listing a job's in process tracking responses.
    JobStatusEnum:
      enum:
      - draft
      - needsReview
      - approved
      - engineering
      - scheduled
      - inProgress
      - complete
      - cancelled
      - hold
      type: string
      description: Job status
    CommonEnumOperationTypeEnum:
      enum:
      - labor
      - setup
      - machine
      - outsideProcessing
      type: string
      description: Operation type
    JobTrackingOperationReworkDto:
      type: object
      properties:
        reasonId:
          type:
          - string
          - 'null'
          description: Identifier of the rework reason.
        reason:
          type:
          - string
          - 'null'
          description: The rework reason.
        notes:
          type:
          - string
          - 'null'
          description: Free-text notes captured when the rework was recorded.
        quantityToRework:
          type: integer
          description: The quantity sent for rework.
          format: int32
        quantityScrapped:
          type: integer
          description: The quantity scrapped as part of the rework.
          format: int32
        hasScrapMaterials:
          type: boolean
          description: Whether scrap materials were tracked as part of the rework.
        createdByUserId:
          type:
          - string
          - 'null'
          description: Identifier of the user who recorded the rework. Please reference /api/users endpoint.
        createdUtc:
          type: string
          description: The datetime the rework was recorded.
          format: date-time
      additionalProperties: false
      description: Rework details associated with a job operation.
    GdtEnumControlType:
      enum:
      - none
      - straightness
      - flatness
      - circularity
      - cylindricity
      - profileOfLine
      - profileOfSurface
      - perpendicularity
      - angularity
      - parallelism
      - position
      - concentricity
      - symmetry
      - runout
      - totalRunout
      - counterbore
      - spotface
      - countersink
      - radius
      - square
      - sphericalRadius
      - controlledRadius
      - diameter
      - sphericalDiameter
      - depth
      - arcLength
      - distance
      - angle
      - note
      - thread
      - surfaceFinish
      - surfaceFinishRemovalByMachining
      - surfaceFinishRemovalProhibited
      type: string
      description: 'Public mirror of FulcrumProduct.Domain.Gdt.Data.ControlType. Members mirror the domain enum

        one-to-one by underlying value (guarded by JobInProcessTrackingEnumParityTests) so it maps by a plain cast,

        decoupling the published contract from renames of the internal enum.'
    CommonEnumCostBreakdownLineTypeEnum:
      enum:
      - material
      - labor
      - setup
      - machine
      - outsideProcessing
      - componentMaterial
      - componentLabor
      - componentMachine
      - componentOutsideProcessing
      - nestPartMaterialUsage
      - nestPartMaterialScrap
      - overhead
      - unknown
      type: string
      description: Cost breakdown types
    ItemsAndInventoryRoutingsCostBreakdownType:
      enum:
      - estimated
      - inProgressJob
      - completedJob
      - cancelledJob
      type: string
    InProcessTrackingEnumQualityUnitOfMeasure:
      enum:
      - millimeter
      - centimeter
      - meter
      - inch
      - foot
      - micrometer
      - microinch
      type: string
      description: 'Public mirror of FulcrumProduct.Domain.Quality.Enums.QualityUnitOfMeasure. Members mirror the

        domain enum one-to-one by underlying value (guarded by JobInProcessTrackingEnumParityTests) so it maps by a

        plain cast, decoupling the published contract from renames of the internal enum.'
    JobTrackingDto:
      required:
      - id
      - name
      - number
      - parentItemId
      - priority
      - quantityToMake
      - status
      - workOrderIds
      - workOrders
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique Id associated to this entity
        number:
          minimum: 0
          type: integer
          description: Job number
          format: int32
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: Job name, defaults to number unless otherwise specified.
        parentItemId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Unique identifier of the parent item produced by this job.

            Please reference api/items endpoint.'
        quantityToMake:
          minimum: 0
          type: number
          description: Quantity of parent item produced by this job
          format: double
        productionDueDate:
          type:
          - string
          - 'null'
          description: Due date
          format: date-time
        earliestStartDate:
          type:
          - string
          - 'null'
          description: If set, this is the earliest date that the job should be scheduled to begin.
          format: date-time
        salesOrderId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: 'Identifier of sales order fulfilled by this job, if applicable.

            Please reference api/sales-orders endpoint.'
        salesOrderLineItemId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: 'Identifier of sales order line item fulfilled by this job, if applicable.

            Please reference endpoints nested under api/sales-orders.'
        createdUtc:
          type: string
          description: The date the job was created
          format: date-time
        originalScheduledStartUtc:
          type:
          - string
          - 'null'
          description: The first scheduled start time.
          format: date-time
        originalScheduledEndUtc:
          type:
          - string
          - 'null'
          description: The first scheduled end time.
          format: date-time
        scheduledStartUtc:
          type:
          - string
          - 'null'
          description: The current scheduled start time.
          format: date-time
        scheduledEndUtc:
          type:
          - string
          - 'null'
          description: The current scheduled end time.
          format: date-time
        completedOnUtc:
          type:
          - string
          - 'null'
          description: The job completion datetime.
          format: date-time
        cancelledOnUtc:
          type:
          - string
          - 'null'
          description: The job cancelled datetime.
          format: date-time
        revenue:
          type:
          - number
          - 'null'
          description: Revenue
          format: double
        notes:
          type:
          - string
          - 'null'
          description: Job level internal notes
        workOrderIds:
          type: array
          items:
            type: string
          description: 'Identifier of work order(s) that this job is associated to, if applicable.

            Please reference api/work-orders endpoint.'
        workOrders:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderReferenceDto'
          description: Work order information, if applicable.
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        customFields:
          type:
          - object
          - 'null'
          additionalProperties: {}
          description: Custom fields that have been defined on this entity.
        previousOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The previously completed operation(s) for the job.
        currentOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The current in progress/paused operation(s) for the job.
        nextOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The next ready operation(s) for the job.
        pendingOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The operations that are awaiting other operations to finish.
        cancelledOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The operations that were cancelled.
        estimatedSetupTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated setup time (in seconds).
          format: double
          readOnly: true
        estimatedRunTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated run time (in seconds).
          format: double
          readOnly: true
        estimatedLaborTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated labor time (in seconds).
          format: double
          readOnly: true
        estimatedMachineTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated machine time (in seconds).
          format: double
          readOnly: true
        elapsedSetupTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed setup time (in seconds).
          format: double
        elapsedRunTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed run time (in seconds).
          format: double
        elapsedLaborTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed labor time (in seconds).
          format: double
        elapsedMachineTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed machine time (in seconds).
          format: double
        customerName:
          type:
          - string
          - 'null'
          description: The customer that this job is associated with
      additionalProperties: false
      description: Represents a job (for tracking purposes). This is essentially a summary of the job's current state.
    CommonTimeDto:
      required:
      - labor
      - machine
      - setup
      type: object
      properties:
        labor:
          minimum: 0
          type: number
          description: Total
          format: double
        machine:
          minimum: 0
          type: number
          description: Cost per unit
          format: double
        setup:
          minimum: 0
          type: number
          description: Cost per unit
          format: double
      additionalProperties: false
      description: Time information
    CommonCostBreakdownDto:
      required:
      - calculatedOn
      - componentLabor
      - componentMachine
      - componentMaterial
      - componentOutsideProcessing
      - cumulative
      - cumulativeLabor
      - cumulativeMachine
      - cumulativeMaterial
      - cumulativeOutsideProcessing
      - id
      - itemLabor
      - itemMachine
      - itemMaterial
      - itemOutsideProcessing
      - lines
      - quantity
      - shopRateMachine
      - shopRateRun
      - shopRateSetup
      - time
      - type
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 24
          type: string
          description: The id of the parent item.
        type:
          $ref: '#/components/schemas/ItemsAndInventoryRoutingsCostBreakdownType'
        quantity:
          minimum: 0
          type: integer
          description: Number of units.
          format: int32
        quantityScrapped:
          minimum: 0
          type:
          - integer
          - 'null'
          description: Number of units scrapped.
          format: int32
        calculatedOn:
          type: string
          description: When was this cost breakdown last calculated/aggregated.
          format: date-time
        time:
          $ref: '#/components/schemas/CommonTimeDto'
        cumulative:
          $ref: '#/components/schemas/CommonCostDto'
        cumulativeMaterial:
          $ref: '#/components/schemas/CommonCostDto'
        cumulativeLabor:
          $ref: '#/components/schemas/CommonCostDto'
        cumulativeMachine:
          $ref: '#/components/schemas/CommonCostDto'
