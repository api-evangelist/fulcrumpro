          format: date-time
        revenue:
          type:
          - number
          - 'null'
          description: Revenue
          format: double
        notes:
          type:
          - string
          - 'null'
          description: Job level internal notes
        workOrderIds:
          type: array
          items:
            type: string
          description: 'Identifier of work order(s) that this job is associated to, if applicable.

            Please reference api/work-orders endpoint.'
        workOrders:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderReferenceDto'
          description: Work order information, if applicable.
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        customFields:
          type:
          - object
          - 'null'
          additionalProperties: {}
          description: Custom fields that have been defined on this entity.
      additionalProperties: false
      description: Represents a job
    JobInProcessTrackingCheckpointDto:
      type: object
      properties:
        id:
          type: string
          description: Id of the checkpoint (the in process tracking field instance on the job's operation).
        itemId:
          type:
          - string
          - 'null'
          description: Id of the item being made that this checkpoint belongs to.
        itemName:
          type:
          - string
          - 'null'
          description: Name of the item being made.
        itemDescription:
          type:
          - string
          - 'null'
          description: Description of the item being made.
        equipmentName:
          type:
          - string
          - 'null'
          description: Name of the equipment scheduled for the operation.
        operationName:
          type:
          - string
          - 'null'
          description: Name of the operation the checkpoint is recorded against.
        operationOrder:
          type: integer
          description: Order of the operation within the job's routing.
          format: int32
        label:
          type:
          - string
          - 'null'
          description: Label describing the checkpoint.
        units:
          type:
          - string
          - 'null'
          description: Units the numeric target and readings are expressed in.
        description:
          type:
          - string
          - 'null'
          description: Free text describing the checkpoint.
        type:
          $ref: '#/components/schemas/InProcessTrackingFieldDataType'
        targetValue:
          type:
          - number
          - 'null'
          description: 'The target or ideal numeric value, expressed in the checkpoint''s drawing units

            (FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.DrawingUnitOfMeasure).'
          format: double
        targetValuePrecision:
          type:
          - integer
          - 'null'
          description: Number of decimal places the target is specified to.
          format: int32
        minimumValue:
          type:
          - number
          - 'null'
          description: 'The minimum acceptable numeric value, expressed in the checkpoint''s drawing units

            (FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.DrawingUnitOfMeasure).'
          format: double
        maximumValue:
          type:
          - number
          - 'null'
          description: 'The maximum acceptable numeric value, expressed in the checkpoint''s drawing units

            (FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.DrawingUnitOfMeasure).'
          format: double
        triggeringBooleanValue:
          type:
          - boolean
          - 'null'
          description: The passing value for a boolean checkpoint.
        triggeringDropdownValue:
          type:
          - string
          - 'null'
          description: The passing value for a dropdown checkpoint.
        checkpointOrder:
          type: integer
          description: The order of the checkpoint within the operation.
          format: int32
        phase:
          $ref: '#/components/schemas/InProcessTrackingFieldCheckpointPhase'
        firstArticle:
          type: boolean
          description: 'Only applies to the During phase. If true (and required), this checkpoint blocks adding

            completed items to inventory until its target is met.'
        isGdt:
          type: boolean
          description: Whether the checkpoint is a GDT (geometric dimensioning and tolerancing) requirement.
        toleranceType:
          $ref: '#/components/schemas/GdtEnumToleranceType'
        controlType:
          $ref: '#/components/schemas/GdtEnumControlType'
        modifier:
          $ref: '#/components/schemas/GdtEnumModifierType'
        datums:
          type:
          - string
          - 'null'
          description: The datum references for a GDT checkpoint.
        gdtCritical:
          type:
          - boolean
          - 'null'
          description: Whether the GDT checkpoint is marked critical.
        bubbleNumber:
          type:
          - integer
          - 'null'
          description: Bubble (balloon) number annotating the checkpoint on the drawing.
          format: int32
        subBubbleNumber:
          type:
          - integer
          - 'null'
          description: Sub-bubble number annotating the checkpoint on the drawing.
          format: int32
        drawingPage:
          type:
          - integer
          - 'null'
          description: Page of the drawing the annotation is on.
          format: int32
        drawingName:
          type:
          - string
          - 'null'
          description: Name of the drawing the checkpoint is annotated on.
        drawingLocation:
          type:
          - string
          - 'null'
          description: Location of the annotation on the drawing.
        drawingUnitOfMeasure:
          $ref: '#/components/schemas/InProcessTrackingEnumQualityUnitOfMeasure'
        recordingUnitOfMeasure:
          $ref: '#/components/schemas/InProcessTrackingEnumQualityUnitOfMeasure'
        recordingTargetValue:
          type:
          - number
          - 'null'
          description: 'The target value converted into recording units (FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingUnitOfMeasure), rounded to

            FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingPrecision. Equal to FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.TargetValue when drawing and recording units

            match; null for non-participating (angular/non-dimensional) checkpoints.'
          format: double
        recordingMinimumValue:
          type:
          - number
          - 'null'
          description: 'The minimum acceptable value in recording units (FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingUnitOfMeasure). Same

            population rule as FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingTargetValue.'
          format: double
        recordingMaximumValue:
          type:
          - number
          - 'null'
          description: 'The maximum acceptable value in recording units (FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingUnitOfMeasure). Same

            population rule as FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingTargetValue.'
          format: double
        recordingPrecision:
          type:
          - integer
          - 'null'
          description: 'The number of decimal places the recording-unit requirement is expressed to. Same population rule as

            FulcrumProduct.PublicApi.Dto.Job.InProcessTracking.JobInProcessTrackingCheckpointDto.RecordingTargetValue.'
          format: int32
        responses:
          type: array
          items:
            $ref: '#/components/schemas/JobInProcessTrackingResponseDto'
          description: Every recorded reading for this checkpoint.
      additionalProperties: false
      description: An in process tracking checkpoint on a job, together with every recorded operator reading for it.
    JobItemToMakeOpStatusEnum:
      enum:
      - pending
      - ready
      - running
      - paused
      - complete
      - cancelled
      type: string
      description: Job Item to Make Operation status
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
