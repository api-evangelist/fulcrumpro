openapi: 3.2.0
info:
  title: Fulcrum Public Job API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Job
paths:
  /api/jobs/{jobId}/cancel:
    post:
      tags:
      - Job
      summary: Cancel a specific job
      operationId: CancelJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: Success
        '204':
          description: Job did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
  /api/jobs:
    post:
      tags:
      - Job
      summary: Create a new job
      operationId: CreateJob
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobCreateDto'
        required: true
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
        '400':
          description: Validation issues with input
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
  /api/jobs/{jobId}:
    get:
      tags:
      - Job
      summary: Get a specific job
      operationId: GetJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: The job for the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          description: Job did not exist
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
    patch:
      tags:
      - Job
      summary: Partially update a job
      operationId: PatchJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatchDocument'
      responses:
        '200':
          description: Job item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          description: Job did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
    put:
      tags:
      - Job
      summary: Update a job
      operationId: UpdateJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobUpdateDto'
        required: true
      responses:
        '200':
          description: Job item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          description: Job did not exist
  /api/jobs/{jobId}/tracking:
    get:
      tags:
      - Job
      summary: Get a specific job's tracking information
      operationId: GetJobTracking
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: The job for the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTrackingDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JobTrackingDto'
        '404':
          description: Job did not exist
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/list:
    post:
      tags:
      - Job
      summary: Find jobs based on search parameters
      operationId: ListJob
      parameters:
      - name: Sort.Field
        in: query
        description: Sort field
        schema:
          minLength: 1
          type: string
      - name: Sort.Dir
        in: query
        description: Sort direction
        schema:
          $ref: '#/components/schemas/CommonEnumSortDirectionEnum'
      - name: Skip
        in: query
        description: Number of records to skip.
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: Take
        in: query
        description: Number of records to return (maximum)
        schema:
          maximum: 5000
          minimum: 0
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobRequestFindParameters'
      responses:
        '200':
          description: List of jobs matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDto'
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/{jobId}/status:
    post:
      tags:
      - Job
      summary: Update a job status
      operationId: StatusUpdateJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
          text/json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobRequestUpdateStatus'
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Job cannot be moved to requested status
        '404':
          description: Job did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit Job
components:
  schemas:
    JobTrackingDto:
      required:
      - id
      - name
      - number
      - parentItemId
      - priority
      - quantityToMake
      - status
      - workOrderIds
      - workOrders
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique Id associated to this entity
        number:
          minimum: 0
          type: integer
          description: Job number
          format: int32
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: Job name, defaults to number unless otherwise specified.
        parentItemId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Unique identifier of the parent item produced by this job.

            Please reference api/items endpoint.'
        quantityToMake:
          minimum: 0
          type: number
          description: Quantity of parent item produced by this job
          format: double
        productionDueDate:
          type:
          - string
          - 'null'
          description: Due date
          format: date-time
        earliestStartDate:
          type:
          - string
          - 'null'
          description: If set, this is the earliest date that the job should be scheduled to begin.
          format: date-time
        salesOrderId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: 'Identifier of sales order fulfilled by this job, if applicable.

            Please reference api/sales-orders endpoint.'
        salesOrderLineItemId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: 'Identifier of sales order line item fulfilled by this job, if applicable.

            Please reference endpoints nested under api/sales-orders.'
        createdUtc:
          type: string
          description: The date the job was created
          format: date-time
        originalScheduledStartUtc:
          type:
          - string
          - 'null'
          description: The first scheduled start time.
          format: date-time
        originalScheduledEndUtc:
          type:
          - string
          - 'null'
          description: The first scheduled end time.
          format: date-time
        scheduledStartUtc:
          type:
          - string
          - 'null'
          description: The current scheduled start time.
          format: date-time
        scheduledEndUtc:
          type:
          - string
          - 'null'
          description: The current scheduled end time.
          format: date-time
        completedOnUtc:
          type:
          - string
          - 'null'
          description: The job completion datetime.
          format: date-time
        cancelledOnUtc:
          type:
          - string
          - 'null'
          description: The job cancelled datetime.
          format: date-time
        revenue:
          type:
          - number
          - 'null'
          description: Revenue
          format: double
        notes:
          type:
          - string
          - 'null'
          description: Job level internal notes
        workOrderIds:
          type: array
          items:
            type: string
          description: 'Identifier of work order(s) that this job is associated to, if applicable.

            Please reference api/work-orders endpoint.'
        workOrders:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderReferenceDto'
          description: Work order information, if applicable.
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        customFields:
          type:
          - object
          - 'null'
          additionalProperties: {}
          description: Custom fields that have been defined on this entity.
        previousOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The previously completed operation(s) for the job.
        currentOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The current in progress/paused operation(s) for the job.
        nextOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The next ready operation(s) for the job.
        pendingOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The operations that are awaiting other operations to finish.
        cancelledOperations:
          type: array
          items:
            $ref: '#/components/schemas/JobTrackingOperationDetailsDto'
          description: The operations that were cancelled.
        estimatedSetupTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated setup time (in seconds).
          format: double
          readOnly: true
        estimatedRunTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated run time (in seconds).
          format: double
          readOnly: true
        estimatedLaborTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated labor time (in seconds).
          format: double
          readOnly: true
        estimatedMachineTimeInSeconds:
          type:
          - number
          - 'null'
          description: Estimated machine time (in seconds).
          format: double
          readOnly: true
        elapsedSetupTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed setup time (in seconds).
          format: double
        elapsedRunTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed run time (in seconds).
          format: double
        elapsedLaborTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed labor time (in seconds).
          format: double
        elapsedMachineTimeInSeconds:
          type:
          - number
          - 'null'
          description: Elapsed machine time (in seconds).
          format: double
        customerName:
          type:
          - string
          - 'null'
          description: The customer that this job is associated with
      additionalProperties: false
      description: Represents a job (for tracking purposes). This is essentially a summary of the job's current state.
    JobUpdateDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the job
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        quantityToMake:
          type:
          - number
          - 'null'
          description: The quantity the job should make
          format: double
        productionDueDate:
          type:
          - string
          - 'null'
          description: The production due date
          format: date-time
        earliestStartDate:
          type:
          - string
          - 'null'
          description: If set, this is the earliest date that the job should be scheduled to begin.
          format: date-time
        notes:
          type:
          - string
          - 'null'
          description: The internal notes
      additionalProperties: false
      description: Represents an update on an Job.
    CommonEnumOperationTypeEnum:
      enum:
      - labor
      - setup
      - machine
      - outsideProcessing
      type: string
      description: Operation type
    CommonEnumCostBreakdownLineTypeEnum:
      enum:
      - material
      - labor
      - setup
      - machine
      - outsideProcessing
      - componentMaterial
      - componentLabor
      - componentMachine
      - componentOutsideProcessing
      - nestPartMaterialUsage
      - nestPartMaterialScrap
      - overhead
      - unknown
      type: string
      description: Cost breakdown types
    JobItemToMakeOpStatusEnum:
      enum:
      - pending
      - ready
      - running
      - paused
      - complete
      - cancelled
      type: string
      description: Job Item to Make Operation status
    JobStatusEnum:
      enum:
      - draft
      - needsReview
      - approved
      - engineering
      - scheduled
      - inProgress
      - complete
      - cancelled
      - hold
      type: string
      description: Job status
    ItemReferenceDto:
      required:
      - id
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique Id associated to this entity
        number:
          maxLength: 200
          minLength: 1
          type: string
          description: Item number.
        revision:
          maxLength: 200
          minLength: 1
          type:
          - string
          - 'null'
          description: Revision name.
        name:
          maxLength: 200
          minLength: 1
          type:
          - string
          - 'null'
          description: Item name.
        description:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Item description.
      additionalProperties: false
      description: Item reference
    JobTrackingOperationReworkDto:
      type: object
      properties:
        reasonId:
          type:
          - string
          - 'null'
          description: Identifier of the rework reason.
        reason:
          type:
          - string
          - 'null'
          description: The rework reason.
        notes:
          type:
          - string
          - 'null'
          description: Free-text notes captured when the rework was recorded.
        quantityToRework:
          type: integer
          description: The quantity sent for rework.
          format: int32
        quantityScrapped:
          type: integer
          description: The quantity scrapped as part of the rework.
          format: int32
        hasScrapMaterials:
          type: boolean
          description: Whether scrap materials were tracked as part of the rework.
        createdByUserId:
          type:
          - string
          - 'null'
          description: Identifier of the user who recorded the rework. Please reference /api/users endpoint.
        createdUtc:
          type: string
          description: The datetime the rework was recorded.
          format: date-time
      additionalProperties: false
      description: Rework details associated with a job operation.
    JobDto:
      required:
      - id
      - name
      - number
      - parentItemId
      - priority
      - quantityToMake
      - status
      - workOrderIds
      - workOrders
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique Id associated to this entity
        number:
          minimum: 0
          type: integer
          description: Job number
          format: int32
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: Job name, defaults to number unless otherwise specified.
        parentItemId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Unique identifier of the parent item produced by this job.

            Please reference api/items endpoint.'
        quantityToMake:
          minimum: 0
          type: number
          description: Quantity of parent item produced by this job
          format: double
        productionDueDate:
          type:
          - string
          - 'null'
          description: Due date
          format: date-time
        earliestStartDate:
          type:
          - string
          - 'null'
          description: If set, this is the earliest date that the job should be scheduled to begin.
          format: date-time
        salesOrderId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: 'Identifier of sales order fulfilled by this job, if applicable.

            Please reference api/sales-orders endpoint.'
        salesOrderLineItemId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: 'Identifier of sales order line item fulfilled by this job, if applicable.

            Please reference endpoints nested under api/sales-orders.'
        createdUtc:
          type: string
          description: The date the job was created
          format: date-time
        originalScheduledStartUtc:
          type:
          - string
          - 'null'
          description: The first scheduled start time.
          format: date-time
        originalScheduledEndUtc:
          type:
          - string
          - 'null'
          description: The first scheduled end time.
          format: date-time
        scheduledStartUtc:
          type:
          - string
          - 'null'
          description: The current scheduled start time.
          format: date-time
        scheduledEndUtc:
          type:
          - string
          - 'null'
          description: The current scheduled end time.
          format: date-time
        completedOnUtc:
          type:
          - string
          - 'null'
          description: The job completion datetime.
          format: date-time
        cancelledOnUtc:
          type:
          - string
          - 'null'
          description: The job cancelled datetime.
          format: date-time
        revenue:
          type:
          - number
          - 'null'
          description: Revenue
          format: double
        notes:
          type:
          - string
          - 'null'
          description: Job level internal notes
        workOrderIds:
          type: array
          items:
            type: string
          description: 'Identifier of work order(s) that this job is associated to, if applicable.

            Please reference api/work-orders endpoint.'
        workOrders:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderReferenceDto'
          description: Work order information, if applicable.
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        customFields:
          type:
          - object
          - 'null'
          additionalProperties: {}
          description: Custom fields that have been defined on this entity.
      additionalProperties: false
      description: Represents a job
    JobItemToMakeStatusEnum:
      enum:
      - new
      - working
      - complete
      - cancelled
      type: string
      description: Job Item to Make status
    JobCreateDto:
      required:
      - quantityToMake
      type: object
      properties:
        nameOfJob:
          type:
          - string
          - 'null'
          description: Name of the job to create. If omitted, the default naming convention will be used
        customerId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: The id of the customer to be created
        autoSchedule:
          type:
          - boolean
          - 'null'
          description: Auto Schedule job. Defaults to FALSE if omitted.
        note:
          maxLength: 2000
          minLength: 1
          type:
          - string
          - 'null'
          description: Note to customer. This will appear on PDFs.
        priority:
          $ref: '#/components/schemas/JobPriorityEnum'
        productionDueDate:
          type:
          - string
          - 'null'
          description: The date that the production of items on the job needs to be completed by.
          format: date-time
        earliestStartDate:
          type:
          - string
          - 'null'
          description: If set, this is the earliest date that the job should be scheduled to begin.
          format: date-time
        quantityToMake:
          type: number
          description: Quantity to make
          format: double
        salesOrderId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: Sales Order Id the job is created for. If used, ItemToMakeId will be ignored.
        salesOrderLineItemId:
          maxLength: 36
          minLength: 36
          type:
          - string
          - 'null'
          description: Sales Order Line Item Id the job is created for. If used, ItemToMakeId will be ignored.
        salesOrderLineItemNameOverride:
          type:
          - string
          - 'null'
          description: Sales Order Line Item - Name Override
        itemToMakeId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: Id of the item to make. If SalesOrderId/SalesOrderLineItemId is set then ItemToMakeId will be ignored
      additionalProperties: false
      description: Details of job to be created
    JsonPatchOperation:
      type: object
      properties:
        op:
          type: string
        value:
          type: string
        path:
          type: string
    JobPriorityEnum:
      enum:
      - low
      - moderate
      - high
      type: string
      description: Job priority
    ItemsAndInventoryRoutingsCostBreakdownType:
      enum:
      - estimated
      - inProgressJob
      - completedJob
      - cancelledJob
      type: string
    JobTrackingItemToMakeDto:
      required:
      - depth
      - id
      - isCustom
      - itemId
      - quantityToMake
      - status
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 36
          type: string
          description: Unique Id associated to this entity
        itemId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Id of the item on which this entity is based.

            Please reference /api/items endpoint.'
        quantityToMake:
          type: number
          description: Quantity of this item produced by the associated job.
          format: double
        isCustom:
          type: boolean
          description: Denotes whether this job produces a customized version of the base item
        status:
          $ref: '#/components/schemas/JobItemToMakeStatusEnum'
        quantityMade:
          type:
          - number
          - 'null'
          description: Quantity already produced, if the job is in progress.
          format: double
        depth:
          type: integer
          description: 'Structurally, identify where in the tree of building the parent item this item lies.

            Example: The top-level item would have a depth of zero and it''s direct subcomponents would be 1.

            This cascades down so that a subcomponent to a subcomponent would be 2... and so on.'
          format: int32
        routingNotes:
          type:
          - string
          - 'null'
          description: 'The routing notes (the "Routing Notes" field) captured on this job''s routing for the item.

            Null when the job''s routing has no note for the item.'
        costBreakdown:
          $ref: '#/components/schemas/CommonCostBreakdownDto'
        costBreakdownEstimated:
          $ref: '#/components/schemas/CommonCostBreakdownDto'
        itemReference:
          $ref: '#/components/schemas/ItemReferenceDto'
      additionalProperties: false
      description: Represents an item to make on a job (for tracking purposes)
    JsonPatchDocument:
      type: array
      items:
        $ref: '#/components/schemas/JsonPatchOperation'
      description: Array of operations to perform
    JobRequestUpdateStatus:
      required:
      - status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        createPOs:
          type:
          - boolean
          - 'null'
          description: 'Create Purchase Orders for the Job. Required for the following statuses: Engineering, Approved'
        isInitialDataImport:
          type:
          - boolean
          - 'null'
          description: 'The job will be created as Complete. No inventory transactions. This is should mostly be used when importing jobs from legacy systems.

            Required for the following statuses: Complete'
      additionalProperties: false
      description: Update a job status.
    DomainOperationsRouting_Step_SetupTimeOption:
      enum:
      - fixed
      - perUnit
      type: string
    JobRequestFindParameters:
      type: object
      properties:
        jobIds:
          maxItems: 500
          minItems: 1
          type:
          - array
          - 'null'
          items:
            type: string
          description: Filter to jobs whose ids are in the list
        numbers:
          maxItems: 500
          minItems: 1
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: Filter jobs to only given numbers
        jobNames:
          maxItems: 500
          minItems: 1
          type:
          - array
          - 'null'
          items:
            type: string
          description: Filter jobs to only given names
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        statuses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JobStatusEnum'
          description: Filter jobs to match the given statuses
        parentItemId:
          type:
          - string
          - 'null'
          description: Filter jobs based on the id of the parent item they produce
        hasIncompleteOperations:
          type:
          - boolean
          - 'null'
          description: "Filters jobs to have those that have at least 1 incomplete operation.\nNote that this will filter out jobs that haven't been approved yet because they technically have \nno operations on them until approved."
        salesOrderId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: 'Filters for jobs that are for this sales order id.

            Please reference /api/sales-orders endpoint.'
        createdBeforeUtc:
          type:
          - string
          - 'null'
          description: Filters jobs created before (exclusive) this parameter in UTC time. If no time component is passed, midnight UTC will be used.
          format: date-time
        createdAfterUtc:
          type:
          - string
          - 'null'
          description: Filters jobs created after (exclusive) this parameter in UTC time. If no time component is passed, midnight UTC will be used.
          format: date-time
        modifiedBeforeUtc:
          type:
          - string
          - 'null'
          description: Filters jobs modified before (exclusive) this parameter in UTC time. If no time component is passed, midnight UTC will be used.
          format: date-time
        modifiedAfterUtc:
          type:
          - string
          - 'null'
          description: 'Filters jobs modified after (exclusive) this parameter in UTC time. If no time component is passed, midnight UTC will be used.

            Useful for polling incrementally instead of re-syncing every job.'
          format: date-time
      additionalProperties: false
      description: Parameters used for searching/finding jobs.
