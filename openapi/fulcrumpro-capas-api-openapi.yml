openapi: 3.2.0
info:
  title: Fulcrum Public CAPAs API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: CAPAs
paths:
  /api/capas:
    post:
      tags:
      - CAPAs
      summary: Create a new CAPA in the New status
      operationId: CreateCapa
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CAPACapaCreateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/CAPACapaCreateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CAPACapaCreateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CAPACapaCreateDto'
        required: true
      responses:
        '200':
          description: CAPA created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreatedResponseDto'
        '400':
          description: Validation issues with input
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Quality-CAPA-Edit CAPA
  /api/capas/{capaId}:
    get:
      tags:
      - CAPAs
      summary: Get a specific CAPA by id
      operationId: GetCapa
      parameters:
      - name: capaId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: The CAPA for the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CAPACapaDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CAPACapaDto'
        '404':
          description: A CAPA with that id does not exist.
      x-c4-exposed: true
      x-c4-required-permissions:
      - Quality-CAPA-View CAPA
  /api/capas/list:
    post:
      tags:
      - CAPAs
      summary: Finds CAPAs based on search parameters
      operationId: ListCAPA
      parameters:
      - name: Sort.Field
        in: query
        description: Sort field
        schema:
          minLength: 1
          type: string
      - name: Sort.Dir
        in: query
        description: Sort direction
        schema:
          $ref: '#/components/schemas/CommonEnumSortDirectionEnum'
      - name: Skip
        in: query
        description: 'Number of records to skip. Defaults to 0. Combine with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Take to page

          through a result set larger than one page.'
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: Take
        in: query
        description: 'Number of records to return. Validation accepts 0 through 5000, but `0` is not a

          page size and what an endpoint does with it varies, so send a value from 1 to 5000.


          Two cases differ. A request that supplies paging but leaves this field out takes this

          field''s default of <b>50</b>. A request that supplies no paging at all is

          endpoint-specific — some define their own fallback — so it does not reliably mean any

          particular number of records. Either way the response says nothing about records it

          did not return, so send this explicitly whenever the size of the answer matters.

          Endpoints returning a paged envelope report `totalCount` and `hasNextPage`

          alongside the records; endpoints returning a bare array report neither, so page those

          with FulcrumProduct.PublicApi.Dto.Common.PagingDto.Skip until a page comes back shorter than the value requested.'
        schema:
          maximum: 5000
          minimum: 0
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CAPARequestCapaListParameters'
          application/json:
            schema:
              $ref: '#/components/schemas/CAPARequestCapaListParameters'
          text/json:
            schema:
              $ref: '#/components/schemas/CAPARequestCapaListParameters'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CAPARequestCapaListParameters'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoCAPACapaDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DtoPagedResultDtoCAPACapaDto'
      x-c4-exposed: true
      x-c4-required-permissions:
      - Quality-CAPA-View CAPA
components:
  schemas:
    DtoPagedResultDtoCAPACapaDto:
      required:
      - data
      - hasNextPage
      - hasPreviousPage
      - page
      - pageSize
      - totalCount
      - totalPages
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CAPACapaDto'
          description: The data
        page:
          type: integer
          description: The 1-indexed page
          format: int32
          readOnly: true
        pageSize:
          type: integer
          description: The page size
          format: int32
          readOnly: true
        totalCount:
          type: integer
          description: The total count of records
          format: int32
        totalPages:
          type: integer
          description: The total pages
          format: int32
          readOnly: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          readOnly: true
        hasNextPage:
          type: boolean
          description: True if there is a next page
          readOnly: true
      additionalProperties: false
      description: Paged result
    CommonEnumSortDirectionEnum:
      enum:
      - ascending
      - descending
      type: string
      description: Specify sorting direction.
    CAPACapaCreateDto:
      required:
      - capaType
      - problemStatement
      type: object
      properties:
        capaType:
          $ref: '#/components/schemas/CAPACapaTypeDto'
        problemStatement:
          maxLength: 2000
          minLength: 1
          type: string
          description: What went wrong, or what could go wrong.
        rootCauseAnalysis:
          maxLength: 2000
          minLength: 1
          type:
          - string
          - 'null'
          description: Root cause analysis text, when it is already known.
        dueDate:
          type:
          - string
          - 'null'
          description: When the CAPA is due. Defaults to one month after creation.
          format: date-time
      additionalProperties: false
      description: 'Definition for creating a CAPA. The CAPA is created in the New status; the linked NCR,

        owner and tasks are set in the app after creation.'
    CAPACapaTypeDto:
      enum:
      - correctiveAction
      - preventiveAction
      - supplierIssue
      - safetyIssue
      type: string
      description: The kind of corrective and preventive action a CAPA tracks.
    CAPACapaDto:
      required:
      - capaType
      - id
      - number
      - problemStatement
      type: object
      properties:
        id:
          maxLength: 24
          minLength: 24
          type: string
          description: Unique id associated to this entity.
        number:
          minimum: 0
          type: integer
          description: Number
          format: int32
        capaType:
          minLength: 1
          type: string
          description: CAPA Type
        problemStatement:
          maxLength: 2000
          minLength: 1
          type: string
          description: Problem statement
        status:
          type:
          - string
          - 'null'
          description: CAPA Status
        rootCauseAnalysis:
          maxLength: 2000
          minLength: 1
          type:
          - string
          - 'null'
          description: Root cause analysis
        correctiveAction:
          maxLength: 2000
          minLength: 1
          type:
          - string
          - 'null'
          description: Corrective action
        ncrId:
          type:
          - string
          - 'null'
          description: Related NCR ID
        createdUtc:
          type:
          - string
          - 'null'
          description: Created Date
          format: date-time
        dueDate:
          type:
          - string
          - 'null'
          description: Completed Date
          format: date-time
        closedUtc:
          type:
          - string
          - 'null'
          description: Completed Date
          format: date-time
      additionalProperties: false
      description: Represents an CAPA
    CAPARequestCapaListParameters:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
          description: 'Filter CAPAs by a specific status

            Accepted Values:

            Closed, Hold, New, Quality Review, Engineering Review'
        type:
          type:
          - string
          - 'null'
          description: Filter CAPAs by a specific type. Available values are configured per tenant in Quality settings (NCR dropdowns).
        ncrId:
          type:
          - string
          - 'null'
          description: Filter CAPAs by a NCR Id
        createdUtc:
          type:
          - string
          - 'null'
          description: 'Filter CAPAs created on or after this instant, time of day included. Combines with

            FulcrumProduct.PublicApi.Controllers.CAPAs.Request.CapaListParameters.CreatedFrom when both are sent.'
          format: date-time
        createdFrom:
          type:
          - string
          - 'null'
          description: 'Filter to CAPAs created on or after this date, as a whole day in the shop''s timezone. Any time

            component is ignored.'
          format: date-time
        createdTo:
          type:
          - string
          - 'null'
          description: 'Filter to CAPAs created on or before this date, as a whole day in the shop''s timezone, so

            a CAPA created later that same shop day still matches.'
          format: date-time
      additionalProperties: false
      description: Parameters used for searching CAPAs
    CreatedResponseDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The id of the created record
      additionalProperties: false
      description: Response for a created record
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
