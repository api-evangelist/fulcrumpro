openapi: 3.2.0
info:
  title: Fulcrum Public Job Item To Make Operation API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Job Item To Make Operation
paths:
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/{operationId}/add-quantity-completed:
    post:
      tags:
      - Job Item To Make Operation
      summary: Adds additional quantity completed to a job operation without completing the…
      description: 'This is a non-idempotent action. Multiple calls with the same parameters will result in

        the quantity being added multiple times. Implement appropriate client-side controls to

        prevent duplicate submissions.'
      operationId: AddQuantityCompletedToJobOperation
      parameters:
      - name: jobId
        in: path
        description: The ID of the job
        required: true
        schema:
          type: string
      - name: itemToMakeId
        in: path
        description: The ID of the item to make
        required: true
        schema:
          type: string
      - name: operationId
        in: path
        description: The ID of the operation
        required: true
        schema:
          type: string
      requestBody:
        description: The request containing the additional quantity to add
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsAddQuantityCompletedRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsAddQuantityCompletedRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsAddQuantityCompletedRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsAddQuantityCompletedRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsToMakeOperationsAddQuantityCompletedResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ItemsToMakeOperationsAddQuantityCompletedResponse'
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit In Progress Job
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/{operationId}/complete:
    post:
      tags:
      - Job Item To Make Operation
      summary: Completes a job operation, optionally recording a final completed quantity and…
      description: 'Closes any open timers on the operation, marks setup and run complete, readies downstream

        operations, and — when this is the item''s final operation, or a split operation that

        produces finished goods — receives finished goods into inventory (unless

        addItemsToInventory is false), completing the item on its final operation and the job once

        every item is done. Quantity made is added on top of quantity recorded earlier, so a

        caller that already reported production via add-quantity-completed should pass zero here.'
      operationId: CompleteJobOperation
      parameters:
      - name: jobId
        in: path
        description: The ID of the job
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        description: The ID of the item to make
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      - name: operationId
        in: path
        description: The ID of the operation
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      requestBody:
        description: 'Completion details: final quantity, scrap, and inventory options'
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsCompleteJobOperationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsCompleteJobOperationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsCompleteJobOperationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ItemsToMakeOperationsCompleteJobOperationRequest'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsToMakeOperationsCompleteJobOperationResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ItemsToMakeOperationsCompleteJobOperationResponse'
        '400':
          description: Validation issues with input, or the operation cannot be completed
        '404':
          description: Job, item to make, or operation did not exist
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit In Progress Job
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/{operationId}:
    get:
      tags:
      - Job Item To Make Operation
      summary: Get a specific operation for an item to make on a job
      operationId: GetJobItemToMakeOperation
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: The operation for the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemToMakeOperationDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ItemToMakeOperationDto'
        '404':
          description: Job, item to make, or operation did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
    post:
      tags:
      - Job Item To Make Operation
      summary: Get a specific operation for an item to make on a job
      operationId: UpdateJobItemToMakeOperation
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ItemToMakeOperationUpdateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/ItemToMakeOperationUpdateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ItemToMakeOperationUpdateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ItemToMakeOperationUpdateDto'
      responses:
        '200':
          description: The operation for the given id
        '400':
          description: Invalid input, or the job's routing cannot take the lead-days change
        '403':
          description: Lead days were sent by a caller without Edit Jobs
        '404':
          description: Job, item to make, or operation did not exist
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit In Progress Job
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/list:
    post:
      tags:
      - Job Item To Make Operation
      summary: Get a list of operations for an item to make on a job
      operationId: ListJobItemToMakeOperation
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: The operations for the given item to make
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemToMakeOperationDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemToMakeOperationDto'
        '404':
          description: Job or item to make did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/{operationId}/items-required/list:
    post:
      tags:
      - Job Item To Make Operation
      summary: Get a list of required items for an operation on a job item to make
      operationId: ListJobItemToMakeOperationItemsRequired
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: The required items for the given operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemToMakeOperationItemRequiredDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemToMakeOperationItemRequiredDto'
        '404':
          description: Job, item to make, or operation did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/{operationId}/materials-required/list:
    post:
      tags:
      - Job Item To Make Operation
      summary: Get a list of required materials for an operation on a job item to make
      operationId: ListJobItemToMakeOperationMaterialsRequired
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      responses:
        '200':
          description: The required materials for the given operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemToMakeOperationMaterialRequiredDto'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemToMakeOperationMaterialRequiredDto'
        '404':
          description: Job, item to make, or operation did not exist
      x-c4-exposed: true
      x-c4-required-permissions:
      - Jobs-Jobs-View Job
  /api/jobs/{jobId}/items-to-make/{itemToMakeId}/operations/{operationId}/pick:
    post:
      tags:
      - Job Item To Make Operation
      summary: Pick a specific item for a specific item to make on a job
      operationId: PickInventoryForJobItemToMakeOperation
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      - name: itemToMakeId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JobItemToMakeOperationPickInventoryDto'
          application/json:
            schema:
              $ref: '#/components/schemas/JobItemToMakeOperationPickInventoryDto'
          text/json:
            schema:
              $ref: '#/components/schemas/JobItemToMakeOperationPickInventoryDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/JobItemToMakeOperationPickInventoryDto'
        required: true
      responses:
        '200':
          description: Inventory transaction processed
        '400':
          description: Validation issues with input
        '404':
          description: The job, item to make, or operation did not exist
      x-c4-exposed: true
      x-c4-mutation: true
      x-c4-required-permissions:
      - Jobs-Jobs-Edit In Progress Job
components:
  schemas:
    ItemsToMakeOperationsAddQuantityCompletedRequest:
      required:
      - additionalQuantity
      type: object
      properties:
        additionalQuantity:
          type: number
          description: 'The additional quantity to add to the operation''s completed quantity.

            Must be greater than zero.'
          format: double
      additionalProperties: false
      description: Request to add additional quantity completed to a job operation
    ItemsToMakeOperationsAddQuantityCompletedResponse:
      required:
      - additionalQuantityAdded
      - itemToMakeId
      - jobId
      - newTotalQuantityCompleted
      - operationId
      - operationStatus
      - previousQuantityCompleted
      - quantityRequired
      type: object
      properties:
        jobId:
          minLength: 1
          type: string
          description: The ID of the job
        itemToMakeId:
          minLength: 1
          type: string
          description: The ID of the item to make
        operationId:
          minLength: 1
          type: string
          description: The ID of the operation
        previousQuantityCompleted:
          type: number
          description: The quantity completed before this action
          format: double
        additionalQuantityAdded:
          type: number
          description: The quantity added in this action
          format: double
        newTotalQuantityCompleted:
          type: number
          description: The new total quantity completed after this action
          format: double
        quantityRequired:
          type: number
          description: The total quantity required for this operation
          format: double
        operationStatus:
          minLength: 1
          type: string
          description: The current status of the operation
      additionalProperties: false
      description: Response after adding additional quantity completed to a job operation
    ItemToMakeOperationUpdateDto:
      type: object
      properties:
        customFields:
          type:
          - object
          - 'null'
          additionalProperties: {}
          description: The custom fields to update on the operation object
        leadTimeInDays:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: 'Outside-processing lead time in days, written to the operation and to the routing step it was built

            from. Only valid on an outside-processing operation, and must be 0 or greater. Omit to leave lead days

            unchanged; null is rejected.'
          format: int32
      additionalProperties: false
      description: Represents an routing operation on a job item to make
    ItemsToMakeOperationsCompleteJobOperationRequest:
      type: object
      properties:
        quantityMade:
          minimum: 0
          type: number
          description: 'Additional quantity completed as part of this completion, added on top of any quantity

            already recorded on the operation. May be zero when all quantity was recorded earlier

            (for example via add-quantity-completed).'
          format: double
        quantityScrapped:
          minimum: 0
          type: number
          description: Quantity scrapped on this operation.
          format: double
        scrapReasonId:
          type:
          - string
          - 'null'
          description: Id of the scrap reason to record with the scrapped quantity. Optional.
        locationId:
          type:
          - string
          - 'null'
          description: 'Id of the inventory location to receive finished goods into when this completion finishes

            the item (last operation). Optional; when omitted the shop''s default location is used.'
        lotNumber:
          type:
          - string
          - 'null'
          description: 'Lot number for finished goods when the item is lot tracked. Required when this completion

            finishes a lot-tracked item and inventory will be created; when omitted in that case for a

            completion that adds quantity, a lot number is generated.'
        expirationDate:
          type:
          - string
          - 'null'
          description: Expiration date for the finished-goods lot. Optional.
          format: date-time
        addItemsToInventory:
          type: boolean
          description: 'Whether finished goods are added to inventory when this completion finishes the item.

            Defaults to true.'
      additionalProperties: false
      description: Request to complete a job operation
    DomainOperationsRouting_Step_RunTimeOption:
      enum:
      - fixed
      - perUnit
      - unitsPerHour
      type: string
    ItemToMakeOperationDto:
      required:
      - id
      - isOutsideProcessing
      - order
      - status
      - systemOperationId
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 36
          type: string
          description: Unique Id associated to this entity
        status:
          $ref: '#/components/schemas/JobItemToMakeOpStatusEnum'
        order:
          minimum: 0
          type: integer
          description: Routing order of the operation
          format: int32
        systemOperationId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Identifier of the system operation associated to this entity

            Please reference api/operations.'
        isOutsideProcessing:
          type: boolean
          description: Denotes whether this is an outside processing operation
        originalScheduledStartUtc:
          type:
          - string
          - 'null'
          description: The first scheduled start time.
          format: date-time
        originalScheduledEndUtc:
          type:
          - string
          - 'null'
          description: The first scheduled end time.
          format: date-time
        scheduledStartUtc:
          type:
          - string
          - 'null'
          description: Scheduled start datetime of the operation
          format: date-time
        scheduledEndUtc:
          type:
          - string
          - 'null'
          description: Scheduled end datetime of the operation
          format: date-time
        completedOnUtc:
          type:
          - string
          - 'null'
          description: The operation completion datetime.
          format: date-time
        completedById:
          type:
          - string
          - 'null'
          description: Operation completed user identifier. Please reference /api/users endpoint.
        scheduledEquipmentId:
          type:
          - string
          - 'null'
          description: Identifier of the equipment that this operation is scheduled to run on
        scheduledEquipmentName:
          type:
          - string
          - 'null'
          description: The name of the equipment that this operation is scheduled to run on.
        customFields:
          type:
          - object
          - 'null'
          additionalProperties: {}
          description: The custom field data on the object
        instructions:
          type:
          - string
          - 'null'
          description: Instructions specific to the item to make operation.
        name:
          type:
          - string
          - 'null'
          description: System operation name.
        leadTimeInDays:
          minimum: 0
          type:
          - integer
          - 'null'
          description: Number of days required between order and receipt. Only applicable for outside processing operations.
          format: int32
        associatedPurchaseOrderIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Associated purchase order IDs.
        estimatedSetupTimeInSeconds:
          type:
          - number
          - 'null'
          description: The estimated setup time in seconds for the operation.
          format: double
        estimatedSetupTimeBasis:
          $ref: '#/components/schemas/DomainOperationsRouting_Step_SetupTimeOption'
        estimatedRunTimeInSeconds:
          type:
          - number
          - 'null'
          description: 'The estimated run time in seconds for the operation.

            Note: This is an obsolete field from when operation could not separate between machine (unattended) and labor (attended) time.'
          format: double
        estimatedRunTimeBasis:
          $ref: '#/components/schemas/DomainOperationsRouting_Step_RunTimeOption'
        estimatedMachineTimeInSeconds:
          type:
          - number
          - 'null'
          description: The estimated machine time in seconds for the operation.
          format: double
        estimatedMachineTimeBasis:
          $ref: '#/components/schemas/DomainOperationsRouting_Step_RunTimeOption'
        estimatedLaborTimeInSeconds:
          type:
          - number
          - 'null'
          description: The estimated labor time in seconds for the operation.
          format: double
        estimatedLaborTimeBasis:
          $ref: '#/components/schemas/DomainOperationsRouting_Step_RunTimeOption'
        isMachineTimeOnly:
          type: boolean
          description: 'Whether this operation can be run without an employee present.  If true, use the machineTime properties.  If false,

            use the laborTime properties.'
        workOrderId:
          maxLength: 24
          minLength: 24
          type:
          - string
          - 'null'
          description: 'Identifier of work order that this operation is associated to, if applicable.

            Please reference api/work-orders endpoint.'
        quantityToMake:
          type: number
          description: 'Quantity this operation is expected to produce.

            Read-only: returned on operation reads but not settable through the update endpoints.'
          format: double
          readOnly: true
        quantityCompleted:
          type: number
          description: 'Quantity already completed on this operation, if the job is in progress.

            Read-only: returned on operation reads but not settable through the update endpoints.'
          format: double
          readOnly: true
        quantityMade:
          type: number
          description: 'Quantity recorded as made on this operation: stamped when the operation completes, and banked through

            receiving on an outside-processing operation. Unlike FulcrumProduct.PublicApi.Dto.Job.ItemToMake.Operation.OperationDto.QuantityCompleted, it does not include

            the running count banked while the operation is in progress.

            Read-only: returned on operation reads but not settable through the update endpoints.'
          format: double
          readOnly: true
        excludeSetupTimeFromAudit:
          type: boolean
          description: 'Whether this operation''s setup time is left out of the routing audit''s job-history averages.

            Read-only: returned on operation reads but not settable through the update endpoints.'
          readOnly: true
        excludeLaborTimeFromAudit:
          type: boolean
          description: 'Whether this operation''s labor time is left out of the routing audit''s job-history averages.

            Read-only: returned on operation reads but not settable through the update endpoints.'
          readOnly: true
        excludeMachineTimeFromAudit:
          type: boolean
          description: 'Whether this operation''s machine time is left out of the routing audit''s job-history averages.

            Read-only: returned on operation reads but not settable through the update endpoints.'
          readOnly: true
      additionalProperties: false
      description: Represents an routing operation on a job item to make
    ItemToMakeOperationMaterialRequiredDto:
      required:
      - id
      - name
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: 'Identifier of the material shape.

            Please reference /api/material-shapes endpoint.'
        name:
          minLength: 1
          type: string
          description: Name of the material shape required
      additionalProperties: false
      description: Represents a required input material for a job operation
    ItemsToMakeOperationsCompleteJobOperationResponse:
      required:
      - inventoryUpdated
      - itemToMakeId
      - jobId
      - operationId
      - operationStatus
      - quantityMadeThisCompletion
      - quantityScrapped
      - totalQuantityCompleted
      type: object
      properties:
        jobId:
          minLength: 1
          type: string
          description: The ID of the job
        itemToMakeId:
          minLength: 1
          type: string
          description: The ID of the item to make
        operationId:
          minLength: 1
          type: string
          description: The ID of the completed operation
        quantityMadeThisCompletion:
          type: number
          description: The quantity added by this completion
          format: double
        totalQuantityCompleted:
          type: number
          description: The operation's total completed quantity after this completion
          format: double
        quantityScrapped:
          type: number
          description: The quantity scrapped recorded by this completion
          format: double
        operationStatus:
          minLength: 1
          type: string
          description: The operation's status after this action
        inventoryUpdated:
          type: boolean
          description: Whether finished goods were added to inventory by this completion
        createdInventoryTransactionId:
          type:
          - string
          - 'null'
          description: The ID of the inventory transaction created by this completion, when inventory was updated
      additionalProperties: false
      description: Response after completing a job operation
    DomainOperationsRouting_Step_SetupTimeOption:
      enum:
      - fixed
      - perUnit
      type: string
    JobItemToMakeOperationPickInventoryDto:
      required:
      - itemId
      - quantity
      type: object
      properties:
        itemId:
          maxLength: 24
          minLength: 24
          type: string
          description: The identifier of the item to be picked. Please reference api/items endpoint
        quantity:
          type: number
          description: Quantity of the item to pick.
          format: double
        locationId:
          type:
          - string
          - 'null'
          description: 'ID of the location to pick from. If not set or set to an empty string, will

            pick from inventory not assigned to a location. Cannot be set if FulcrumProduct.PublicApi.Dto.Job.ItemToMake.OperationPickInventoryDto.UseDefaultLocation

            is set to ```true```.'
        useDefaultLocation:
          type: boolean
          description: 'If set to true, inventory will be picked from the default location for the item. If set to true,

            FulcrumProduct.PublicApi.Dto.Job.ItemToMake.OperationPickInventoryDto.LocationId cannot be set.  If the item does not have a default location set and this

            is set to true, will pick from inventory not assigned to a location.'
        lotId:
          type:
          - string
          - 'null'
          description: The ID of the lot to pick from.
      additionalProperties: false
      description: Pick event for an input item
    ItemToMakeOperationItemRequiredDto:
      required:
      - itemId
      - itemNumber
      type: object
      properties:
        itemId:
          maxLength: 24
          minLength: 24
          type: string
          description: 'Identifier of the required item.

            Please reference /api/items endpoint.'
        itemNumber:
          maxLength: 200
          minLength: 1
          type: string
          description: Item number of the required item
        revision:
          type:
          - string
          - 'null'
          description: Revision of the required item
      additionalProperties: false
      description: Represents a required input item for a job operation
    JobItemToMakeOpStatusEnum:
      enum:
      - pending
      - ready
      - running
      - paused
      - complete
      - cancelled
      type: string
      description: Job Item to Make Operation status
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Accounting Code
  tags:
  - Accounting Code
- name: Alert
  tags:
  - Alert
- name: Attachment
  tags:
  - Attachment
  - Attachment Certification
- name: Auth
  tags:
  - Auth
- name: CAPAs
  tags:
  - CAPAs
- name: Change Order
  tags:
  - Change Order
- name: Chart Of Accounts
  tags:
  - Chart Of Accounts
- name: Company Info
  tags:
  - Company Info
