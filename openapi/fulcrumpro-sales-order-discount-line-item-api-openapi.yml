openapi: 3.0.4
info:
  title: Fulcrum Public Accounting Code Sales Order Discount Line Item API
  version: v1
servers:
- url: https://api.fulcrumpro.com
tags:
- name: Sales Order Discount Line Item
paths:
  /api/sales-orders/{salesOrderId}/discount-line-item:
    get:
      tags:
      - Sales Order Discount Line Item
      summary: Get the discount line item for a sales order
      operationId: GetSalesOrderDiscountLineItem
      parameters:
      - name: salesOrderId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: Discount line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDiscountLineItemDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SalesOrderDiscountLineItemDto'
        '204':
          description: Discount line item does not exist
        '404':
          description: Sales order did not exist
      x-c4-required-permissions:
      - Orders-SalesOrders-View Sales Order
    put:
      tags:
      - Sales Order Discount Line Item
      summary: Update the discount line item for a sales order
      operationId: UpdateSalesOrderDiscountLineItem
      parameters:
      - name: salesOrderId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SalesOrderDiscountLineItemUpdateDto'
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderDiscountLineItemUpdateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/SalesOrderDiscountLineItemUpdateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SalesOrderDiscountLineItemUpdateDto'
        required: true
      responses:
        '200':
          description: Discount line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDiscountLineItemDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SalesOrderDiscountLineItemDto'
        '404':
          description: Sales order or discount line item did not exist
      x-c4-mutation: true
      x-c4-required-permissions:
      - Orders-SalesOrders-Edit Sales Order
    delete:
      tags:
      - Sales Order Discount Line Item
      summary: Delete the discount line item for a sales order
      operationId: DeleteSalesDiscountLineItem
      parameters:
      - name: salesOrderId
        in: path
        required: true
        schema:
          maxLength: 24
          minLength: 24
          type: string
      responses:
        '200':
          description: Success
        '204':
          description: Discount line item did not exist
        '404':
          description: Sales order did not exist
components:
  schemas:
    CommonExternalReferenceDto:
      required:
      - externalId
      type: object
      properties:
        type:
          maxLength: 50
          minLength: 0
          type: string
          description: Specifies the type of this identifier.
          nullable: true
        externalId:
          maxLength: 500
          minLength: 0
          type: string
          description: The external identifier
        displayId:
          maxLength: 500
          minLength: 0
          type: string
          description: 'The id/number that a human sees. For a quote, this might be ''Q1000''.  If this is null, the display

            will fall back to the ExternalId'
          nullable: true
        status:
          type: string
          description: A status for the external reference
          nullable: true
        url:
          type: string
          description: An external url for the reference
          nullable: true
        modifiedUtc:
          type: string
          description: Date the external reference was modified
          format: date-time
          nullable: true
        lastSyncedUtc:
          type: string
          description: 'Date the external system last successfully synced this reference. Set by integrations

            on successful sync only; null means never synced or that the sync timestamp isn''t

            maintained by the integration.'
          format: date-time
          nullable: true
      additionalProperties: false
      description: The external reference for entities that implement FulcrumProduct.Domain.Common.IHasExternalReferences
    CommonAccountingDetailsDto:
      type: object
      properties:
        classId:
          maxLength: 24
          minLength: 24
          type: string
          description: Item class identifier. Please reference /api/item-classes endpoint.
          nullable: true
        incomeAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: Income account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
        assetAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: Asset account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
        expenseAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: Expense account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
        cogsAccountId:
          maxLength: 24
          minLength: 24
          type: string
          description: COGS account (chart of accounts) key identifier. Please reference /api/chart-of-accounts endpoint.
          nullable: true
      additionalProperties: false
      description: An object that contains all accounting details.
    SalesOrderDiscountLineItemUpdateDto:
      required:
      - amount
      - isPercentage
      - name
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: The name of the discount line.
        description:
          maxLength: 200
          minLength: 1
          type: string
          description: The description of the discount line.
          nullable: true
        isPercentage:
          type: boolean
          description: Indicates whether "Amount" value is percentage based or an absolute amount.
        amount:
          minimum: 0
          type: number
          description: The amount of the discount.
          format: double
        externalReferences:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CommonExternalReferenceDto'
          description: Arbitrary key-value-pair like data that can be used to later on search for this line item.
          nullable: true
      additionalProperties: false
      description: Represents a discount line item on a sales order.
    SalesOrderDiscountLineItemDto:
      required:
      - accountingDetails
      - amount
      - id
      - isPercentage
      - name
      type: object
      properties:
        id:
          maxLength: 36
          minLength: 36
          type: string
          description: Unique id associated to this entity.
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: The name of the discount line.
        description:
          maxLength: 200
          minLength: 1
          type: string
          description: The name of the discount line.
          nullable: true
        isPercentage:
          type: boolean
          description: Indicates whether FulcrumProduct.PublicApi.Dto.SalesOrder.DiscountLineItem.DiscountLineItemDto.Amount discount is percentage based (else, it's an absolute amount).
        amount:
          minimum: 0
          type: number
          description: The amount of the discount.
          format: double
        externalReferences:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CommonExternalReferenceDto'
          description: Arbitrary key-value-pair like data that can be used to later on search for this line item.
          nullable: true
        absoluteAmount:
          minimum: 0
          type: number
          description: The absolute amount of the discount.
          format: double
          nullable: true
        number:
          type: integer
          description: Line number
          format: int32
        accountingDetails:
          $ref: '#/components/schemas/CommonAccountingDetailsDto'
        price:
          type: number
          description: The calculated amount of this discount.
          format: double
          nullable: true
      additionalProperties: false
      description: Represents a discount line item on a sales order.
  securitySchemes:
    bearer:
      type: http
      description: Your API bearer token generated in System Data > Advanced > Public API Setup
      scheme: bearer
      bearerFormat: JWT
