notes: >-
  Fulcrum publishes a dated developer changelog. Changes are predominantly
  additive ("addition-only"); superseded endpoints are marked obsolete. Recent
  window captured below.
entries:
- date: '2026-04-23'
  breaking: false
  highlights: >-
    Added v2 Material endpoints (Get, Vendor List, Vendor Create, Vendor Update)
    that accept identifiers in the request body instead of the URL path; original
    path-based endpoints marked obsolete to handle identifiers containing reserved
    URL characters like "/".
- date: '2026-04-12'
  breaking: false
  highlights: >-
    Introduced Item "Can-Make" endpoint returning canMakeFromOnHand and
    canMakeFromAvailable for make items; added earliestScheduledStartUtc to Job
    Create, Get, and Update.
- date: '2026-04-10'
  breaking: false
  highlights: Extended customFields support to Customer Create, Patch, and Update (addition-only).
- date: '2026-04-06'
  breaking: false
  highlights: Added productionDueDate field to the Sales Order Get endpoint.
- date: '2026-03-24'
  breaking: false
  highlights: >-
    Fixed Item Routing Operation Batch to apply inputMaterialIds association and
    validation to existing routing steps, not just newly created ones.
- date: '2026-03-05'
  breaking: false
  highlights: >-
    Added Tax Allocations endpoints for purchase order part line items, line
    items, fee line items, and outside-processing line items.
- date: '2026-03-02'
  breaking: false
  highlights: >-
    Introduced Job Item-To-Make Operation "Items Required" and "Materials Required"
    endpoints for retrieving operation dependencies.
- date: '2026-02-24'
  breaking: false
  highlights: >-
    Added createdFromQuoteId to Sales Order Get and List, enabling quote-origin
    resolution without full quote scanning.
